    if(tt>0){const v=1.35;let dist=tt*v;const target=a.tesBound?new THREE.Vector3(6.6,0,-4.8):ROUTE[0];

      if(dist<d0){x=a.sx+(target.x-a.sx)*dist/d0;z=a.sz+(target.z-a.sz)*dist/d0;}
      else if(a.tesBound){x=6.6+(i%3-1)*0.18;z=-4.8+((i>>2)%3-1)*0.18;y=h(6.6,-4.8)+1.52;}
      else{const L=routeCurve.getLength(),u=Math.min(1,(dist-d0)/L),p=routeCurve.getPointAt(u);x=p.x+(u>=1?((i%5)-2)*0.12:0);z=p.z+(u>=1?((i>>3)%3-1)*0.12:0);}}
    if(y===undefined)y=h(x,z)+0.07;am.makeTranslation(x,y,z);agents.setMatrixAt(i,am);});agents.instanceMatrix.needsUpdate=true;}
placeAgents(0,99);scene.add(agents);

// labels
const labelsEl=$('#labels');
function tag(text,pos,group,cls){const e=document.createElement('div');e.className='tagl'+(cls?' '+cls:'');e.textContent=text;e.hidden=true;labelsEl.appendChild(e);return {e,v:new THREE.Vector3(...pos),group};}
const TAGS=[tag('Lempeng Indo-Australia',[-9.8,-3.4,ZE+0.05],'sec'),tag('Lempeng Eurasia',[6,-2.4,ZE+0.05],'sec'),tag('Mantel',[-9.6,-5.2,ZE+0.05],'sec'),
 tag('Palung',[TR,-3.55,ZE+0.05],'sec'),tag('Bidang megathrust',[-1.6,slabTop(-1.6)+0.35,ZE+0.05],'sec'),tag('Episentrum',[X0,0.45,ZE+0.05],'sec'),tag('Hiposentrum',[X0+1.15,HYPO_Y-0.05,ZE+0.05],'sec'),
 tag('Titik kumpul (bukit)',[hillTop.x,hillTop.y+1.0,hillTop.z],'evac','safe'),tag('TES (gedung evakuasi)',[6.6,h(6.6,-4.8)+2.0,-4.8],'evac','safe'),tag('Jalur evakuasi',[7.3,h(7.3,-0.7)+0.55,-0.7],'evac','safe'),
 tag('Sirene',[4.6,h(4.6,3.6)+1.6,3.6],'evac'),tag('Hutan mangrove',[3.3,0.9,5.2],'evac')];

// hotspots
const SP={hipo:[X0,HYPO_Y,ZE+0.06],epi:[X0,0.2,ZE-0.6],palung:[TR,-3.9,ZE+0.06],gelombang:[-1.2,0.35,-1],pantai:[3.4,0.35,0.5],evak:[hillTop.x,hillTop.y+0.35,hillTop.z],ews:[-8.5,0.55,2]};
const CAM={hipo:[[-2,-2.2,15],[-3,-3.6,ZE]],epi:[[-1,4,15],[-3,-1.5,ZE]],palung:[[-6,-2,15],[-6.5,-3.6,ZE]],gelombang:[[3,7,14],[-1,0,0]],pantai:[[8,4,8],[3.2,0,0.5]],evak:[[13,8,7],[8,1.2,-2]],ews:[[-3,4,10],[-6.5,0,2.5]]};
SPOTS.forEach((s,i)=>{s.v=new THREE.Vector3(...SP[s.id]);const b=document.createElement('button');b.className='hs';b.textContent=i+1;b.setAttribute('aria-label',s.name);b.onclick=()=>select(s.id);labelsEl.appendChild(b);s.el=b;});

// ---------- simulation ----------
let tween=null,sim=null;
const banner=$('#banner');
function showBanner(txt,sub,cls){banner.className='banner'+(cls?' '+cls:'');banner.innerHTML=esc(txt)+(sub?'<small>'+esc(sub)+'</small>':'');banner.hidden=false;}
function fly(p,t){tween={t:0,p0:camera.position.clone(),t0:controls.target.clone(),p1:new THREE.Vector3(...p),t1:new THREE.Vector3(...t)};tween.p1.sub(tween.t1).multiplyScalar(fitK()).add(tween.t1);}
function fitK(){return Math.max(1,Math.pow(1.45/camera.aspect,0.7));}
function setBtn(id,on){$(id).setAttribute('aria-pressed',on?'true':'false');}
function highlight(id){SPOTS.forEach(s=>s.el.classList.toggle('on',s.id===id));document.querySelectorAll('#partsList button').forEach(b=>b.classList.toggle('on',b.dataset.id===id));}
function resetSim(){sim=null;ov.visible=false;flood.visible=false;banner.hidden=true;placeAgents(0,99);for(let i=0;i<seaP.count;i++)seaP.setY(i,0);seaP.needsUpdate=true;}
function setMode(m){mode=m;setBtn('#aQuake',m==='quake');setBtn('#aTsu',m==='tsu');setBtn('#aEvac',m==='evac');
  const ev=m==='evac'||m==='tsu';routeLine.visible=arrows.visible=ev;if(m!=='quake'&&m!=='tsu')resetSim();}

const QUAKE={eyebrow:'Simulasi · Gempa tektonik',name:'Saat Lempeng Bergeser',tag:'Energi menjalar sebagai gelombang seismik',
 desc:'Lempeng Indo-Australia yang terkunci di bidang megathrust tiba-tiba bergeser. Lingkaran pada penampang menunjukkan gelombang seismik yang menjalar dari hiposentrum ke segala arah.',
 facts:[['Gelombang P (primer)','Tercepat, ± 6 km/detik di kerak'],['Gelombang S (sekunder)','Lebih lambat, tidak melewati zat cair'],['Gelombang permukaan','Paling lambat, paling merusak']],
 tahu:'Selisih waktu tibanya gelombang P dan S di seismograf dipakai untuk menghitung jarak stasiun ke episentrum.'};
const TSU={eyebrow:'Simulasi · Tsunami dekat pantai',name:'Dari Gempa ke Tsunami',tag:'Waktu emas untuk menyelamatkan diri',
 desc:'Dasar laut di atas bidang megathrust terangkat dan mendorong air laut. Gelombang menjalar ke dua arah. Ikuti jamnya: warga yang langsung mengungsi sampai di bukit dan gedung TES sebelum gelombang tiba.',
 flowT:'Urutan kejadian',flow:['Gempa kuat mengguncang (menit ke-0)','BMKG mengeluarkan peringatan dini (± menit ke-5)','Warga mengungsi ke bukit dan gedung TES','Air laut tiba-tiba surut di pantai','Tsunami menerjang daratan rendah','Tetap di tempat tinggi, gelombang bisa datang lagi']};
const STAGE_T=[0,2.5,3.2,8.3,10.4,15];
function startSim(withTsu){resetSim();sim={t:0,tsu:withTsu,xc1:X0,xc2:X0,flood:0,stage:-1};ov.visible=true;}
function showQuake(){current=null;highlight(null);
  renderInfo(QUAKE,true,'<div class="live"><div class="eyebrow">Penampang · Gelombang seismik</div><div class="legend"><span><i style="background:#3ca0ff"></i>Gelombang P</span><span><i style="background:#ff463c"></i>Gelombang S</span></div><button class="go alt" id="pAgain">Ulangi getaran</button> <button class="go" id="pNext">Lanjut ke tsunami</button></div>');
  $('#pAgain').onclick=()=>startSim(false);$('#pNext').onclick=()=>$('#aTsu').click();}
function showTsu(){current=null;highlight(null);
  renderInfo(TSU,true,'<div class="live"><div class="eyebrow">Waktu sejak gempa</div><div class="clock" id="tClock">00<span>menit</span></div><p class="note">Waktu dipercepat. Contoh untuk tsunami yang sumbernya dekat pantai.</p><button class="go alt" id="pAgain">Ulangi simulasi</button></div>');
  $('#pAgain').onclick=()=>startSim(true);liveFn=updTsu;}
function updTsu(){if(!sim)return;const c=$('#tClock');if(!c)return;c.innerHTML=String(Math.min(60,Math.round(sim.t*2))).padStart(2,'0')+'<span>menit</span>';
  const fl=$('#flow');if(!fl)return;[...fl.children].forEach((li,i)=>{li.classList.toggle('now',i===sim.stage);li.classList.toggle('done',i<sim.stage);});}

$('#aQuake').onclick=()=>{if(mode==='quake'){setMode(null);select(null);return;}setMode('quake');showQuake();fly([-1.5,-1,19],[-2.5,-2.6,ZE]);startSim(false);};
$('#aTsu').onclick=()=>{if(mode==='tsu'){setMode(null);select(null);return;}setMode('tsu');showTsu();fly([5,9,20],[0.5,0,0]);startSim(true);};
const EVAC={eyebrow:'Mitigasi · Kesiapsiagaan',name:'Rencana Evakuasi',tag:'Tahu ke mana harus lari sebelum bencana',
 desc:'Garis hijau putus-putus menunjukkan jalur evakuasi dari permukiman pesisir ke bukit. Warga di sisi selatan menuju gedung TES karena lebih dekat.',tahu:'Siapkan tas siaga bencana: air minum, makanan ringan, obat-obatan, senter, peluit, salinan dokumen penting, dan pakaian ganti.'};
function showEvac(){current=null;highlight(null);
  renderInfo(EVAC,true,null,'<h2>Saat gempa terjadi</h2><ul class="check"><li>Lindungi kepala, berlindung di bawah meja yang kuat</li><li>Jauhi kaca, lemari, dan benda yang bisa jatuh</li><li>Setelah guncangan berhenti, keluar dengan tenang lewat tangga, bukan lift</li></ul>'+
   '<h2>Jika berada di pesisir</h2><ul class="check"><li>Jangan menunggu sirene bila gempa terasa kuat atau lama</li><li>Ikuti rambu jalur evakuasi menuju bukit atau gedung TES</li><li>Berjalan kaki atau bersepeda, hindari kemacetan kendaraan</li><li>Bertahan di tempat tinggi sampai dinyatakan aman</li></ul>');}
$('#aEvac').onclick=()=>{if(mode==='evac'){setMode(null);select(null);return;}setMode('evac');showEvac();fly([13,9,9],[7.5,1,-1.5]);};

function select(id,keepCam){
  current=id;highlight(id);liveFn=null;
  if(!id){if(mode)setMode(null);renderInfo(OVERVIEW,false);if(!keepCam)fly(HOME.p,HOME.t);return;}
  const s=SPOTS.find(x=>x.id===id);
  if(s.evac){if(mode!=='evac')setMode('evac');}else if(mode)setMode(null);
  renderInfo(s,true);if(!keepCam)fly(CAM[id][0],CAM[id][1]);
}
$('#aFull').onclick=()=>{try{if(document.fullscreenElement)document.exitFullscreen();else stage.requestFullscreen().catch(()=>{});}catch(e){}};
function applyTheme(){const v=getComputedStyle(document.documentElement).getPropertyValue('--stage').trim()||'#dde3e6';renderer.setClearColor(new THREE.Color(v));}
applyTheme();try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);}catch(e){}
new MutationObserver(applyTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
function resize(){const w=stage.clientWidth,hh=stage.clientHeight;renderer.setSize(w,hh,false);camera.aspect=w/hh;camera.updateProjectionMatrix();}
new ResizeObserver(resize).observe(stage);resize();

const G=(x,w)=>Math.exp(-(x*x)/(2*w*w));
const depth=x=>Math.max(0.04,-prof(x));
const D0=depth(X0);
const shoal=x=>Math.min(3.2,Math.pow(D0/depth(x),0.25));
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;
function stepSim(dt){
  const s=sim;s.t+=dt;const t=s.t;
  // stages + banners
  let st=0;for(let i=0;i<STAGE_T.length;i++)if(t>=STAGE_T[i])st=i;
  if(st!==s.stage){s.stage=st;
    if(!s.tsu){if(st===0)showBanner('Gempa M 8,0 · kedalaman 25 km','Gelombang seismik menjalar dari hiposentrum');}
    else{const B=[['Gempa M 8,0 · kedalaman 25 km','Pusat gempa di laut, dekat zona subduksi'],['Peringatan dini tsunami','BMKG: segera menjauhi pantai'],['Warga mengungsi ke tempat tinggi','Ikuti jalur evakuasi'],['Air laut tiba-tiba surut','Tanda alam: tsunami akan datang'],['Tsunami menerjang pesisir','Daratan rendah tergenang'],['Warga selamat di bukit dan gedung TES','Tunggu pernyataan aman dari BMKG/BPBD']];
      showBanner(B[st][0],B[st][1],st===5?'ok':st===2?'info':'');}}
  if(t<4.5)drawWaves(t);else if(ov.visible){drawWaves(-1);ov.visible=false;}
  hypo.scale.setScalar(t<3?0.7+0.4*Math.abs(Math.sin(t*14)):0.7);
  epiRing.scale.setScalar(t<4?1+t*3:1);epiRing.material.opacity=t<4?Math.max(0.2,1-t/4):1;
  if(!s.tsu){if(t>6){banner.hidden=true;sim=null;}return;}
  // tsunami surface
  const H=0.55*sm(1,2.2,t);
  if(t>2.4){s.xc1+=0.8*Math.sqrt(Math.max(0.35,depth(s.xc1)))*dt;s.xc2-=0.8*Math.sqrt(depth(s.xc2))*dt;}
  const split=sm(2.2,3.2,t);
  for(let i=0;i<seaP.count;i++){const x=seaX[i];let e;
    if(t<=2.4)e=H*G(x-X0,1.4);
    else{const w1=0.6+0.5*Math.sqrt(depth(s.xc1)),A1=0.27*shoal(x);
      e=(1-split)*H*G(x-X0,1.4)+split*(A1*(G(x-s.xc1,w1)-0.5*G(x-(s.xc1+1.5),0.85))+0.27*G(x-s.xc2,1.3));
      if(s.xc1>3.0)e*=Math.max(0,1-(s.xc1-3)*0.6);}
    seaP.setY(i,e+0.01*Math.sin(seaZ[i]*1.3+t*2));}
  seaP.needsUpdate=true;seaG.computeVertexNormals();
  if(s.xc1>2.6&&!s.fl0){s.fl0=t;}
  if(s.fl0){const u=t-s.fl0;s.flood=u<1.6?1.25*sm(0,1.6,u):u<4?1.25:1.25*(1-sm(4,7,u));flood.visible=s.flood>0.02;flood.position.y=s.flood;}
  placeAgents(t,3.0);
  if(t>24){banner.hidden=true;}
}

const clock=new THREE.Clock(),tv=new THREE.Vector3(),jit=new THREE.Vector3();
function proj(v,el){tv.copy(v).project(camera);const w=stage.clientWidth,hh=stage.clientHeight;const hide=tv.z>1||Math.abs(tv.x)>1.05||Math.abs(tv.y)>1.05;el.hidden=hide;
  if(!hide){el.style.left=((tv.x*.5+.5)*w)+'px';el.style.top=((-tv.y*.5+.5)*hh)+'px';}}
let liveT=0;
function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(clock.getDelta(),0.05),T=clock.elapsedTime;
  if(tween){tween.t=Math.min(1,tween.t+dt/1.1);const e=1-Math.pow(1-tween.t,3);camera.position.lerpVectors(tween.p0,tween.p1,e);controls.target.lerpVectors(tween.t0,tween.t1,e);if(tween.t>=1)tween=null;}
  controls.update();
  if(sim)stepSim(dt);
  else{for(let i=0;i<seaP.count;i+=1)seaP.setY(i,0.02*Math.sin(seaX[i]*1.8+T*1.4)+0.015*Math.cos(seaZ[i]*1.5+T));seaP.needsUpdate=true;}
  buoy.position.y=0.05+0.03*Math.sin(T*2);
  sh.material.color.setHex(sim&&sim.tsu&&sim.t>2.5&&sim.t<16&&Math.floor(T*4)%2?0xff3b2f:0xe0a800);
  jit.set(0,0,0);if(sim&&sim.t<3&&!REDUCED){const k=0.12*(1-sim.t/3);jit.set((Math.random()-.5)*k,(Math.random()-.5)*k,(Math.random()-.5)*k);}
  camera.position.add(jit);
  renderer.render(scene,camera);
  SPOTS.forEach(s=>{if(mode==='quake'||mode==='tsu'){s.el.hidden=true;return;}proj(s.v,s.el);});
  const secOn=mode==='quake'||['hipo','epi','palung'].includes(current);
  TAGS.forEach(t=>{const on=t.group==='sec'?secOn:(mode==='evac'||(mode==='tsu'&&t.e.textContent.startsWith('Titik')));if(!on){t.e.hidden=true;return;}proj(t.v,t.e);});
  camera.position.sub(jit);
  liveT+=dt;if(liveFn&&liveT>0.15){liveT=0;liveFn();}
}
camera.position.sub(controls.target).multiplyScalar(fitK()).add(controls.target);
loop();
})();
</script>
