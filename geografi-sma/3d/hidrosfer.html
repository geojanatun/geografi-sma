.app{display:grid;gap:16px;grid-template-columns:1fr}

  border:2px solid #fff;background:var(--accent);color:#fff;font-family:var(--mono);font-size:.85rem;
  display:grid;place-items:center;box-shadow:0 2px 10px rgba(0,0,0,.35);transition:transform .15s}

.tagl{position:absolute;left:0;top:0;transform:translate(-50%,-50%);font-family:var(--mono);font-size:.72rem;color:#fff;

.steps{list-style:none;margin:0;padding:0;display:grid;gap:6px}

.kur{margin-top:18px;font-family:var(--mono);font-size:.7rem;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}

.cmp .row{display:grid;grid-template-columns:110px 1fr;gap:10px;align-items:center;margin-top:8px;font-size:.9rem}
.meter{height:12px;border-radius:9px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;border-radius:9px;transition:width .6s}
.cmp p{margin:10px 0 0;font-size:.92rem}
.zones{width:100%;border-collapse:collapse;font-size:.88rem;margin-top:4px}

.zones th{font-family:var(--mono);font-weight:500;font-size:.7rem;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.tblwrap{overflow-x:auto}

.quiz .q{font-family:var(--display);font-weight:700;font-size:1.25rem;line-height:1.25;margin:4px 0 14px;text-wrap:balance}
.opts{display:grid;gap:8px}

.fb{margin-top:12px;font-size:.95rem}
.bar{height:6px;border-radius:9px;background:var(--line);overflow:hidden;margin:10px 0 4px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.score{font-family:var(--display);font-weight:800;font-size:3.4rem;line-height:1;color:var(--accent)}

.embed .top{display:none}

  if(x<5.8)return 0.35-(x-5)/0.8*0.45;
  if(x<7.8)return -0.1-(x-5.8)/2*0.7;
  if(x<9.3)return -0.8-(x-7.8)/1.5*2.4;
  return -3.2-(x-9.3)/2.7*0.6;
}
function riverZ(x){const t=Math.min(1,Math.max(0,(x+11)/17));return (0.25+1.5*t*t)*Math.sin(x*0.6+0.4);}
const LAKE={x:-4,z:riverZ(-4),rx:1.7,rz:1.2};
function hRaw(x,z){
  const t=Math.min(1,Math.max(0,(x+11)/16)),landF=1-sm(4.2,6,x),az=Math.abs(z);
  let y=prof(x);
  y+=landF*2.3*Math.exp(-(((az-5.4)/1.2)**2))*(1-0.4*t);
  y+=2.2*Math.exp(-(((x+12)/1.3)**2));
  const d=z-riverZ(x),w=0.55+1.6*t,ch=Math.exp(-((d/w)**2));

  y-=(1-sm(5.0,5.9,x))*(0.95-0.6*t)*ch;

}
function h(x,z){

function spawnRain(i,cx,cz,full){const x=cx+(Math.random()-.5)*3.2,z=cz+(Math.random()-.5)*3,y=full?h(x,z)+Math.random()*6:6.4;rainA.set([x,y,z,x-0.05,y-0.35,z],i*6);}

// labels
const labelsEl=$('#labels');
function tag(text,pos,group,num,big){const e=document.createElement('div');e.className='tagl'+(big?' big':'');e.innerHTML=(num?'<b>'+num+'</b>':'')+esc(text);e.hidden=true;labelsEl.appendChild(e);return {e,v:new THREE.Vector3(...pos),group};}
const TAGS=[];
const stepPos=[[9,2.6,1.5],[-6.8,h(-6.8,-3.6)+1.6,-3.6],[-7,8.4,-1.5],[1.5,8.6,0],[-7.4,4.6,0.8],[-4.2,h(-4.2,ZE)-0.8,ZE+0.05],[1.2,h(1.2,riverZ(1.2))+0.6,riverZ(1.2)],[2.6,h(2.6,ZE)-1.0,ZE+0.05]];
STEPS.forEach((s,i)=>TAGS.push(Object.assign(tag(s[0],stepPos[i],'cyc',i+1),{step:i})));
[['Litoral',[5.5,0.45,ZE+0.05]],['Neritik · 0–200 m',[6.8,-0.45,ZE+0.05]],['Batial · 200–2.000 m',[8.6,-1.9,ZE+0.05]],['Abisal · > 2.000 m',[10.7,-3.35,ZE+0.05]]].forEach(a=>TAGS.push(tag(a[0],a[1],'sea')));
[['HULU',[-8,5.5,0]],['TENGAH',[-1,3.4,0]],['HILIR',[3.8,2.0,0]]].forEach(a=>TAGS.push(tag(a[0],a[1],'das',null,true)));
TAGS.push(tag('Igir · batas DAS',[-5,h(-5,5.4)+0.5,5.4],'das'));TAGS.push(tag('Igir · batas DAS',[-5,h(-5,-5.4)+0.5,-5.4],'das'));

// watershed divide line
(function(){const pts=[];for(let x=4.4;x>=-11;x-=0.1)pts.push(new THREE.Vector3(x,h(x,-5.4)+0.06,-5.4));
 for(let a=-Math.PI/2;a<=Math.PI/2;a+=0.05){const x=-11-0.6*Math.cos(a),z=5.4*Math.sin(a);pts.push(new THREE.Vector3(x,h(x,z)+0.06,z));}
 for(let x=-11;x<=4.4;x+=0.1)pts.push(new THREE.Vector3(x,h(x,5.4)+0.06,5.4));
 const g=new THREE.BufferGeometry().setFromPoints(pts);const l=new THREE.Line(g,new THREE.LineDashedMaterial({color:0xb3261e,dashSize:0.3,gapSize:0.18}));l.computeLineDistances();l.visible=false;scene.add(l);window.__divide=l;})();

// hotspots
const SP={hulu:[-9.6,null,null],danau:[LAKE.x,LAKE_Y+0.25,LAKE.z],tengah:[0.8,null,null],hilir:[5.4,null,null],airtanah:[-6.5,h(-6.5,ZE)-1.0,ZE+0.06],laut:[9.2,0.35,-1.5],hutan:[-7.5,h(-7.5,-4.2)+0.7,-4.2]};
const CAM={hulu:[[-4,8,8],[-9.6,3.5,riverZ(-9.6)]],danau:[[-0.5,6.5,5],[LAKE.x,LAKE_Y,LAKE.z]],tengah:[[5,6,7],[0.8,1.2,riverZ(0.8)]],hilir:[[9,5,7],[5.2,0.3,riverZ(5.2)]],
  airtanah:[[-5,1.5,16],[-5,1.5,ZE]],laut:[[8.6,0.6,17.5],[8.6,-1.4,ZE]],hutan:[[-3,9,-12],[-7,3,-3]]};
SPOTS.forEach((s,i)=>{const p=SP[s.id];if(p[1]===null){p[2]=riverZ(p[0]);p[1]=h(p[0],p[2])+0.35;}
  s.v=new THREE.Vector3(...p);const b=document.createElement('button');b.className='hs';b.textContent=i+1;b.setAttribute('aria-label',s.name);b.onclick=()=>select(s.id);labelsEl.appendChild(b);s.el=b;});

// ---------- state & UI ----------
let tween=null,cyc={t:0};
function fly(p,t){tween={t:0,p0:camera.position.clone(),t0:controls.target.clone(),p1:new THREE.Vector3(...p),t1:new THREE.Vector3(...t)};tween.p1.sub(tween.t1).multiplyScalar(fitK()).add(tween.t1);}
function fitK(){return Math.max(1,Math.pow(1.45/camera.aspect,0.7));}
function setBtn(id,on){$(id).setAttribute('aria-pressed',on?'true':'false');}
function highlight(id){SPOTS.forEach(s=>s.el.classList.toggle('on',s.id===id));document.querySelectorAll('#partsList button').forEach(b=>b.classList.toggle('on',b.dataset.id===id));}

function setMode(m){
  mode=m;setBtn('#aCyc',m==='cyc');setBtn('#aDas',m==='das');setBtn('#aSea',m==='sea');
  window.__divide.visible=m==='das';paint();
  EV.p.visible=m==='cyc';TR.p.visible=m==='cyc'&&!bare;GW.p.visible=m==='cyc';rain.visible=m==='cyc';
  if(m==='cyc'){cyc.t=0;for(let i=0;i<RN2;i++)spawnRain(i,-7,0,true);}
}
const CYC={eyebrow:'Proses · Siklus air',name:'Siklus Hidrologi',tag:'Air berputar tanpa henti',
 desc:'Perhatikan animasinya: uap naik dari laut, awan bergerak ke pegunungan, hujan turun, lalu air kembali ke laut lewat sungai dan air tanah. Ketuk tiap tahap untuk melihat letaknya.',
 flowT:'Jenis siklus',flow:['Siklus pendek: air laut menguap, lalu hujan turun di laut','Siklus sedang: hujan turun di darat, lalu kembali ke laut lewat sungai','Siklus panjang: uap air menjadi salju atau es, lalu mencair dan mengalir ke laut'],
 tahu:'Matahari adalah "mesin" siklus hidrologi. Panasnya menguapkan air, dan perbedaan suhu yang ditimbulkannya menggerakkan angin pembawa awan.'};
function showCyc(){current=null;highlight(null);
  renderInfo(CYC,true,null,'<h2>Tahapan</h2><ol class="steps">'+STEPS.map((s,i)=>'<li><button data-s="'+i+'"><i>'+(i+1)+'</i><div><strong>'+esc(s[0])+'</strong><span>'+esc(s[1])+'</span></div></button></li>').join('')+'</ol>');
  panel.querySelectorAll('.steps button').forEach(b=>b.onclick=()=>{const i=+b.dataset.s;panel.querySelectorAll('.steps button').forEach(x=>x.classList.toggle('on',x===b));
    TAGS.forEach(t=>t.e.classList.toggle('hot',t.step===i));const p=stepPos[i];
    const front=i===5||i===7;fly(front?[p[0]+2,p[1]+2,ZE+9]:[p[0]+7,p[1]+5,p[2]+11],p);});}
const DAS={eyebrow:'Perairan darat · DAS',name:'Daerah Aliran Sungai',tag:'Satu wilayah, satu sungai utama',
 desc:'DAS adalah wilayah daratan yang dibatasi punggung bukit (igir). Semua air hujan yang jatuh di dalamnya mengalir ke sungai utama, lalu ke danau atau laut. Garis merah putus-putus menandai batasnya.',
 tahu:'Sungai Citarum, sungai terpanjang di Jawa Barat, mengisi tiga waduk besar: Saguling, Cirata, dan Jatiluhur.'};
function showDas(){current=null;highlight(null);
  renderInfo(DAS,true,null,'<h2>Perbandingan bagian DAS</h2><div class="tblwrap"><table class="zones"><thead><tr><th></th><th>Hulu</th><th>Tengah</th><th>Hilir</th></tr></thead><tbody>'+
   '<tr><td>Lereng</td><td>Curam</td><td>Landai</td><td>Sangat landai</td></tr><tr><td>Arus</td><td>Deras</td><td>Sedang</td><td>Lambat</td></tr>'+
   '<tr><td>Proses</td><td>Erosi vertikal</td><td>Erosi lateral</td><td>Sedimentasi</td></tr><tr><td>Lembah</td><td>Huruf V</td><td>Huruf U</td><td>Dataran luas</td></tr>'+
   '<tr><td>Bentukan</td><td>Air terjun, jeram</td><td>Meander</td><td>Delta, tanggul alam</td></tr></tbody></table></div>');}

function bareHtml(){const inf=bare?22:78,run=bare?85:25;
  return '<div class="cmp"><div class="eyebrow">Simulasi · '+(bare?'Hutan gundul':'Hutan lebat')+'</div>'+
   '<div class="row"><span>Air meresap</span><div class="meter"><i style="width:'+inf+'%;background:#2f8fbf"></i></div></div>'+
   '<div class="row"><span>Limpasan</span><div class="meter"><i style="width:'+run+'%;background:#a2552a"></i></div></div>'+
   '<p>'+(bare?'Tanpa pohon, hujan langsung menghantam tanah dan mengalir di permukaan sambil membawa lumpur. Sungai cepat meluap di hilir dan cadangan air tanah berkurang.':'Tajuk dan akar pohon menahan air hujan sehingga lebih banyak yang meresap ke tanah. Sungai tetap mengalir saat kemarau karena diisi air tanah.')+'</p>'+
   '<button class="go" id="pBare">'+(bare?'Hijaukan kembali (reboisasi)':'Lihat jika hutan gundul')+'</button></div>'+
   '<p style="font-size:.8rem;color:var(--muted);margin:-8px 0 16px">Panjang batang menunjukkan perbandingan, bukan angka pengukuran.</p>';}
function setBare(on){bare=on;setBtn('#aBare',on);trees.visible=!on;paint();rMat.color.set(on?0x9a7650:0x3f93c4);TR.p.visible=mode==='cyc'&&!on;
  if(current==='hutan')select('hutan',true);}
$('#aBare').onclick=()=>{setBare(!bare);if(current!=='hutan'&&!mode)select('hutan');};

$('#aCyc').onclick=()=>{if(mode==='cyc'){setMode(null);select(null);}else{setMode('cyc');showCyc();fly([3,10,27],[-1,3,0]);}};
$('#aDas').onclick=()=>{if(mode==='das'){setMode(null);select(null);}else{setMode('das');showDas();fly([-1,25,11],[-2.5,0,0]);}};
$('#aSea').onclick=()=>{if(mode==='sea'){setMode(null);select(null);}else{setMode('sea');select('laut',false,true);}};

function select(id,keepCam,keepMode){
  current=id;highlight(id);TAGS.forEach(t=>t.e.classList.remove('hot'));
  if(!id){if(!keepMode&&mode)setMode(null);renderInfo(OVERVIEW,false);if(!keepCam)fly(HOME.p.toArray(),HOME.t.toArray());return;}
  const s=SPOTS.find(x=>x.id===id);
  if(s.sea){if(mode!=='sea')setMode('sea');}else if(mode&&!keepMode)setMode(null);
  if(s.bare)renderInfo(s,true,bareHtml());else renderInfo(s,true);
  const pb=$('#pBare');if(pb)pb.onclick=()=>setBare(!bare);
  if(!keepCam)fly(CAM[id][0],CAM[id][1]);
}
$('#aFull').onclick=()=>{try{if(document.fullscreenElement)document.exitFullscreen();else stage.requestFullscreen().catch(()=>{});}catch(e){}};

function applyTheme(){const v=getComputedStyle(document.documentElement).getPropertyValue('--stage').trim()||'#d7e4e6';renderer.setClearColor(new THREE.Color(v));}
applyTheme();try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);}catch(e){}
new MutationObserver(applyTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
function resize(){const w=stage.clientWidth,hh=stage.clientHeight;renderer.setSize(w,hh,false);camera.aspect=w/hh;camera.updateProjectionMatrix();}
new ResizeObserver(resize).observe(stage);resize();

const clock=new THREE.Clock(),tv=new THREE.Vector3();
function proj(v,el){tv.copy(v).project(camera);const w=stage.clientWidth,hh=stage.clientHeight;const hide=tv.z>1||Math.abs(tv.x)>1.05||Math.abs(tv.y)>1.05;el.hidden=hide;
  if(!hide){el.style.left=((tv.x*.5+.5)*w)+'px';el.style.top=((-tv.y*.5+.5)*hh)+'px';}}
function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(clock.getDelta(),0.05),T=clock.elapsedTime;
  if(tween){tween.t=Math.min(1,tween.t+dt/1.1);const e=1-Math.pow(1-tween.t,3);camera.position.lerpVectors(tween.p0,tween.p1,e);controls.target.lerpVectors(tween.t0,tween.t1,e);if(tween.t>=1)tween=null;}
  controls.update();
  for(let i=0;i<seaP.count;i++){const x=seaBase[i*3],z=seaBase[i*3+2];seaP.setY(i,0.035*Math.sin(x*2.1+T*1.6)+0.025*Math.cos(z*1.7+T*1.2));}
  seaP.needsUpdate=true;
  rtex.offset.y-=dt*(bare?0.9:0.55);
  if(mode==='cyc'){
    cyc.t=(cyc.t+dt)%14;const ph=cyc.t/14;
    const cx=9-ph*17;cl1.position.set(cx,7+0.3*Math.sin(T),-1.5);cl1.scale.setScalar(0.55+ph*0.75);
    const raining=cx<-4.5;rain.visible=raining;
    if(raining){for(let i=0;i<RN2;i++){const k=i*6;rainA[k+1]-=dt*9;rainA[k+4]-=dt*9;if(rainA[k+4]<h(rainA[k],rainA[k+2]))spawnRain(i,cx,-1.5,false);}rainG.attributes.position.needsUpdate=true;}
    for(let i=0;i<EV.n;i++){EV.life[i]+=dt*0.25;EV.a[i*3+1]+=dt*1.3;EV.a[i*3]-=dt*0.25;if(EV.a[i*3+1]>6.5)spawnEV(i);}EV.g.attributes.position.needsUpdate=true;
    if(!bare){for(let i=0;i<TR.n;i++){TR.a[i*3+1]+=dt*0.7;TR.life[i]+=dt;if(TR.life[i]>2)spawnTR(i);}TR.g.attributes.position.needsUpdate=true;}
    const active=bare?0.25:1;
    for(let i=0;i<GW.n;i++){const x=GW.a[i*3],s=h(x,ZE),target=s-1.05;
      if(i/GW.n>active){GW.a[i*3+1]=-50;continue;}
      if(GW.a[i*3+1]<-40)spawnGW(i);
      if(GW.a[i*3+1]>target)GW.a[i*3+1]-=dt*0.7;else{GW.a[i*3]+=dt*0.9;GW.a[i*3+1]=Math.max(target-0.25,Math.min(GW.a[i*3+1],h(GW.a[i*3],ZE)-1.0));}
      if(GW.a[i*3]>5.6)spawnGW(i);}
    GW.g.attributes.position.needsUpdate=true;
  }else{cl1.position.set(-7,7+0.2*Math.sin(T*0.5),-1.5);cl1.scale.setScalar(1);}
  cl2.position.x=3+Math.sin(T*0.15)*1.5;cl3.position.x=9+Math.cos(T*0.12)*1.2;
  const st=TAGS.find(t=>t.step===2);if(st)st.v.set(cl1.position.x,cl1.position.y+1.3,cl1.position.z);
  renderer.render(scene,camera);
  SPOTS.forEach(s=>{if(mode==='cyc'||mode==='das'){s.el.hidden=true;return;}proj(s.v,s.el);});
  TAGS.forEach(t=>{if(t.group!==mode){t.e.hidden=true;return;}proj(t.v,t.e);});
}
camera.position.sub(controls.target).multiplyScalar(fitK()).add(controls.target);
loop();
})();
</script>
