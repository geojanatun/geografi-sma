function walker(s,rx,sx,out){const L1=Math.abs(sx-rx),L2=YH-YL,P=2*(L1+L2);let u=s*P;
  if(u<L1){out[0]=lerp(sx,rx,u/L1);out[1]=YL;out[2]=0;return;}u-=L1;
  if(u<L2){out[0]=rx;out[1]=YL+u;out[2]=1;return;}u-=L2;
  if(u<L1){out[0]=lerp(rx,sx,u/L1);out[1]=YH;out[2]=2;return;}u-=L1;out[0]=sx;out[1]=YH-u;out[2]=3;}

  if(s.oro&&!oro){setOro(true);setJung(false);}if(s.jung&&!jung){setJung(true);climbM=3600;updateClimber();}
  if(!s.oro&&!s.jung&&scn==='gun'){setOro(false);setJung(false);}
  let pre=null;if(s.sc==='enso')pre='<div class="live"><div class="seg">'+['normal','nino','nina'].map(k=>'<button data-enso="'+k+'" aria-pressed="'+(ensoKey===k)+'">'+ENSO_TXT[k].t+'</button>').join('')+'</div></div>';
  renderInfo(s,true,pre);panel.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>setEnso(b.dataset.enso));
  if(!keepCam){const c=SCAM[id];if(id==='termoklin'){const i=45;fly([X3,0.2,13],[X3,-cur.d[i],EZ]);}else fly(c[0],c[1]);}
}
function setScene(k,silent){
  scn=k;current=null;highlight(null);
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.s===k?'true':'false'));
  A.visible=k==='atm';B.visible=k==='gun';Cc.visible=k==='enso';
  $('#scaleNote').textContent=k==='atm'?'Ketinggian tidak sesuai skala':k==='gun'?'Tinggi puncak ± 3.600 m · skala tegak dibesarkan':'Ukuran dan kedalaman tidak sesuai skala';
  controls.minDistance=k==='atm'?6:4;
  const sn=$('#scaleNote');sn.style.color=k==='atm'?'#d6deea':'var(--muted)';sn.style.textShadow=k==='atm'?'':'none';
  if(k!=='gun'){setJung(false);setOro(false);}
  buildDock();applyTheme();
  if(!silent){overview();fly(...HOMES[k]);}
}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>setScene(t.dataset.s));

function applyTheme(){const cs=getComputedStyle(document.documentElement);const v=(scn==='atm'?cs.getPropertyValue('--space'):cs.getPropertyValue('--stage')).trim()||'#0b1222';renderer.setClearColor(new THREE.Color(v));}
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);}catch(e){}
new MutationObserver(applyTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
function resize(){const w=stage.clientWidth,hh=stage.clientHeight;renderer.setSize(w,hh,false);camera.aspect=w/hh;camera.updateProjectionMatrix();}
new ResizeObserver(resize).observe(stage);resize();
setScene('atm',true);

const clock=new THREE.Clock(),tv=new THREE.Vector3(),tmpOut=[0,0,0];
function proj(v,el){tv.copy(v).project(camera);const w=stage.clientWidth,hh=stage.clientHeight;const hide=tv.z>1||Math.abs(tv.x)>1.05||Math.abs(tv.y)>1.05;el.hidden=hide;
  if(!hide){el.style.left=((tv.x*.5+.5)*w)+'px';el.style.top=((-tv.y*.5+.5)*hh)+'px';}}
function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(clock.getDelta(),0.05),T=clock.elapsedTime;
  if(tween){tween.t=Math.min(1,tween.t+dt/1.1);const e=1-Math.pow(1-tween.t,3);camera.position.lerpVectors(tween.p0,tween.p1,e);controls.target.lerpVectors(tween.t0,tween.t1,e);if(tween.t>=1)tween=null;}
  controls.update();
  if(scn==='atm'){
    plane.position.set(3.2*Math.cos(T*0.35),2.7,3.2*Math.sin(T*0.35));plane.rotation.y=-T*0.35-Math.PI/2;objTags[0].v.set(plane.position.x,3.15,plane.position.z);
    balloon.position.y=5.0+0.12*Math.sin(T*0.8);
    METS.forEach(m=>{m.t+=dt*m.speed;if(m.t>1.4)resetMet(m);const k=Math.min(1,m.t);const hx=m.x+m.dx*k,hy=8.3-1.6*k,hz=m.z;
      const p=m.l.geometry.attributes.position;p.setXYZ(0,hx,hy,hz);p.setXYZ(1,hx-m.dx*0.35,hy+0.55,hz);p.needsUpdate=true;
      const a=m.t<1?Math.sin(k*Math.PI):0;m.l.material.opacity=a;m.hd.material.opacity=a;m.hd.position.set(hx,hy,hz);});
    for(let i=0;i<auP.count;i++){const x=auBase[i*3],y=auBase[i*3+1];auP.setZ(i,0.5*Math.sin(x*0.9+T*0.8)+0.25*Math.sin(x*2.1-T*1.3)+(y>0?0.2*Math.sin(T+x):0));}auP.needsUpdate=true;
    aurora.material.opacity=0.45+0.15*Math.sin(T*1.7);
    iss.position.set(4.1*Math.cos(T*0.5),10.6,4.1*Math.sin(T*0.5));iss.rotation.y=-T*0.5;objTags[6].v.set(iss.position.x,11.1,iss.position.z);
    satl.position.set(3.4*Math.cos(-T*0.3+2),13.3,3.4*Math.sin(-T*0.3+2));satl.rotation.y=T*0.3;objTags[7].v.set(satl.position.x,13.8,satl.position.z);
    LAY.forEach(L=>{layerMeshes[L.id].material.opacity=current===L.id?L.o*2.6:L.o;});
  }
  if(scn==='gun'&&oro){
    for(let i=0;i<ON;i++){const o=oData[i];o.x+=o.v*dt;if(o.x>8)spawnO(i,false);
      const g=Math.max(0,hB(o.x,o.z));const y=g+o.off+(o.x<0.5?0.25*sm(-6,0.5,o.x):0);
      oPos[i*3]=o.x;oPos[i*3+1]=y;oPos[i*3+2]=o.z;
      let c;if(o.x<-1.2)c=[0.35,0.62,1];else if(o.x<0.6)c=[0.92,0.96,1];else c=[1,0.6,0.25];oCol.set(c,i*3);}
    oGeo.attributes.position.needsUpdate=true;oGeo.attributes.color.needsUpdate=true;
    for(let i=0;i<RNB;i++){const k=i*6;rbA[k+1]-=dt*7;rbA[k+4]-=dt*7;if(rbA[k+4]<hB(rbA[k],rbA[k+2]))spawnRB(i,false);}rbG.attributes.position.needsUpdate=true;
    oroClouds.children.forEach((c,i)=>c.position.y+=Math.sin(T*0.8+i)*0.002);
  }
  if(scn==='enso'){
    if(ensoK<1){ensoK=Math.min(1,ensoK+dt/2.2);const e=sm(0,1,ensoK);
      for(let i=0;i<=NX;i++){cur.T[i]=lerp(ensoFrom.T[i],ensoTo.T[i],e);cur.d[i]=lerp(ensoFrom.d[i],ensoTo.d[i],e);}
      cur.rx=lerp(ensoFrom.rx,ensoTo.rx,e);cur.sx=lerp(ensoFrom.sx,ensoTo.sx,e);cur.v=lerp(ensoFrom.v,ensoTo.v,e);cur.up=lerp(ensoFrom.up,ensoTo.up,e);updateEnsoMesh();}
    for(let i=0;i<WN;i++){wS[i]=(wS[i]+dt*0.045*cur.v)%1;walker(wS[i],cur.rx,cur.sx,tmpOut);wPos.set([tmpOut[0],tmpOut[1],wZ[i]],i*3);wCol.set(WC[tmpOut[2]],i*3);}
    wG.attributes.position.needsUpdate=true;wG.attributes.color.needsUpdate=true;
    ensoClouds.position.x=cur.rx;
    for(let i=0;i<RNC;i++){const k=i*6;rcA[k+1]-=dt*6;rcA[k+4]-=dt*6;if(rcA[k+4]<0)spawnRC(i,false);}rcG.attributes.position.needsUpdate=true;
    const ua=Math.round(UN*Math.min(1,cur.up));for(let i=0;i<UN;i++){if(i>=ua){uPos[i*3+1]=-50;continue;}if(uPos[i*3+1]<-40)uPos[i*3+1]=-ED;uPos[i*3+1]+=dt*0.6*cur.up;if(uPos[i*3+1]>-0.05)uPos[i*3+1]=-ED;}uG.attributes.position.needsUpdate=true;
    riseTag.v.set(X3+cur.rx,5.4,0);sinkTag.v.set(X3+cur.sx,3.4,0);const ti=30;thTag.v.set(X3+xs[ti],-cur.d[ti]-0.25,EZ+0.05);
    hsEls.termoklin.v.set(X3+xs[50],-cur.d[50],EZ+0.06);
  }
  renderer.render(scene,camera);
  Object.values(hsEls).forEach(s=>{if(s.sc!==scn||(scn==='gun'&&(jung||oro)&&!s.oro&&!s.jung)){s.el.hidden=true;return;}proj(s.v,s.el);});
  TAGS.forEach(t=>{if(t.sc!==scn||(t.cond&&!t.cond())){t.e.hidden=true;return;}proj(t.v,t.e);});
}
camera.position.sub(controls.target).multiplyScalar(fitK()).add(controls.target);
loop();
})();
</script>
