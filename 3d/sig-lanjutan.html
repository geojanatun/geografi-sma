function inQ(v){return S.query&&v.d>S.thr;}
function liveBuf(){let h='<div class="live">';
  if(!S.bufG&&!S.bufR&&!S.query&&!S.net&&!S.interp)h+='<section><div class="eyebrow">Belum ada analisis aktif</div><p style="margin:6px 0 0">Pilih salah satu tombol analisis di bawah model.</p></section>';
  if(S.bufG){const n=VILL.filter(inBuf);h+='<section><div class="eyebrow">Buffer gunung api</div><div class="big" id="bR">'+String(S.radius).replace('.',',')+'<span>km dari kawah</span></div>'+
    '<input class="range" id="bRange" type="range" min="1" max="12" step="0.5" value="'+S.radius+'" aria-label="Jari-jari buffer dalam km"><p style="margin:4px 0 0"><b id="bCount">'+n.length+' dari 8 desa</b> berada di dalam zona.</p>'+
    '<ul class="vlist" id="bList">'+VILL.slice().sort((a,b)=>a.dist-b.dist).map(v=>'<li class="'+(inBuf(v)?'in':'')+'">'+esc(v.n)+'<span>'+v.dist.toFixed(1).replace('.',',')+' km</span></li>').join('')+'</ul></section>';}
  if(S.bufR)h+='<section><div class="eyebrow">Buffer sungai</div><p style="margin:6px 0 0">Koridor biru muda selebar 100 m di setiap tepi sungai. Bangunan tidak boleh didirikan di dalam sempadan.</p></section>';
  if(S.query){const n=VILL.filter(inQ);h+='<section><div class="eyebrow">Query atribut</div><div class="formula">kepadatan &gt; <b id="qT">'+fnum(S.thr)+'</b> jiwa/km²</div>'+
    '<input class="range" id="qRange" type="range" min="400" max="2200" step="100" value="'+S.thr+'" aria-label="Batas kepadatan"><p style="margin:4px 0 0"><b id="qCount">'+n.length+' desa</b> memenuhi syarat.</p>'+
    '<ul class="vlist" id="qList">'+VILL.slice().sort((a,b)=>b.d-a.d).map(v=>'<li class="'+(inQ(v)?'q':'')+'">'+esc(v.n)+'<span>'+fnum(v.d)+' jiwa/km²</span></li>').join('')+'</ul></section>';}
  if(S.net)h+='<section><div class="eyebrow">Analisis jaringan</div><div class="big">± '+routeLen.toFixed(1).replace('.',',')+'<span>km</span></div><p style="margin:4px 0 0">Rute terpendek dari Sukamaju ke titik evakuasi melalui jalan desa, lewat Pasirjati.</p></section>';
  if(S.interp)h+='<section><div class="eyebrow">Interpolasi curah hujan</div><div class="ramp" style="background:linear-gradient(90deg,#eff3ff,#bdd7ee,#6baed6,#3182bd,#084594)"></div><div class="rampl"><span>1.800</span><span>2.600</span><span>3.400 mm</span></div><p class="note">Garis gelap adalah isohyet setiap 250 mm.</p></section>';
  h+='<p class="note">Desa dan angka pada model ini fiktif, untuk latihan.</p></div>';return h;}
function bindBuf(){const r=$('#bRange');if(r)r.oninput=()=>{S.radius=+r.value;updBuf(true);};
  const q=$('#qRange');if(q)q.oninput=()=>{S.thr=+q.value;updBuf(true);};}
function updBuf(partial){repaint();wall.visible=scn==='buf'&&S.bufG;wall.scale.set(S.radius,1,S.radius);routeM.visible=scn==='buf'&&S.net;flag.visible=scn==='buf';statG.visible=scn==='buf'&&S.interp;
  VILL.forEach(v=>{const a=inBuf(v),b=inQ(v);v.m.material.color.setHex(a&&b?0x862e9c:a?0xe03131:b?0x1c64c4:0xf1f3f5);v.t.e.className='tagl'+(a&&b?' both':a?' danger':b?' q':'');v.t.e.textContent=v.n+(S.query?' · '+fnum(v.d):'');});
  syncDock();
  if(partial){const bR=$('#bR');if(bR){bR.innerHTML=String(S.radius).replace('.',',')+'<span>km dari kawah</span>';$('#bCount').textContent=VILL.filter(inBuf).length+' dari 8 desa';
      $('#bList').innerHTML=VILL.slice().sort((a,b)=>a.dist-b.dist).map(v=>'<li class="'+(inBuf(v)?'in':'')+'">'+esc(v.n)+'<span>'+v.dist.toFixed(1).replace('.',',')+' km</span></li>').join('');}
    const qT=$('#qT');if(qT){qT.textContent=fnum(S.thr);$('#qCount').textContent=VILL.filter(inQ).length+' desa';$('#qList').innerHTML=VILL.slice().sort((a,b)=>b.d-a.d).map(v=>'<li class="'+(inQ(v)?'q':'')+'">'+esc(v.n)+'<span>'+fnum(v.d)+' jiwa/km²</span></li>').join('');}}}
function ndviTxt(n){return n<0?'Air atau awan':n<0.2?'Lahan terbuka atau terbangun':n<0.5?'Vegetasi jarang':'Vegetasi rapat';}
function liveRs(){const b=(arr,key,cur)=>'<div class="seg">'+arr.map(a=>'<button data-'+key+'="'+a[0]+'" aria-pressed="'+(cur===a[0])+'">'+a[1]+'</button>').join('')+'</div>';
  let h='<div class="live"><section><div class="eyebrow">Resolusi spasial (ukuran piksel)</div>'+b([['0.5','0,5 m'],['10','10 m'],['30','30 m']],'res',R3.res)+'</section>'+
   '<section><div class="eyebrow">Tampilan citra</div>'+b([['rgb','Warna asli'],['cir','Inframerah'],['ndvi','NDVI']],'mode',R3.mode)+
   (R3.mode==='ndvi'?'<div class="ramp" style="background:linear-gradient(90deg,#2166ac 0%,#d6c8a0 32%,#e6d36a 48%,#8cc04a 72%,#1f6b2a 100%)"></div><div class="rampl"><span>−0,4</span><span>0</span><span>0,2</span><span>0,5</span><span>0,85</span></div>':'')+
   (R3.mode==='cir'?'<p class="note">Band NIR ditampilkan merah, band merah ditampilkan hijau, band hijau ditampilkan biru.</p>':'')+'</section>'+
   '<section class="probe" id="probe">'+probeHtml()+'</section></div>';return h;}
function probeHtml(){if(!R3.probe)return '<div class="eyebrow">Baca nilai piksel</div><p style="margin:6px 0 0">Ketuk citra (atau lahan) untuk membaca nilai satu piksel.</p>';
  const p=R3.probe,f=RESF[R3.res],s=blockStats(f,p.bx,p.by),nd=(s.N-s.R)/(s.N+s.R);
  const comp=Object.entries(s.cnt).sort((a,b)=>b[1]-a[1]).slice(0,3).map(e=>CNAME[e[0]]+' '+Math.round(e[1]/s.n*100)+'%');
  return '<div class="eyebrow">Piksel terpilih · '+String(R3.res).replace('.',',')+' m</div><p style="margin:6px 0 4px"><b>'+(comp.length>1?'Piksel campuran':CNAME[Object.keys(s.cnt)[0]])+'</b>'+(comp.length>1?' · '+esc(comp.join(', ')):'')+'</p>'+
   '<div class="formula">NDVI = ('+f2(s.N)+' − '+f2(s.R)+') ÷ ('+f2(s.N)+' + '+f2(s.R)+') = <b>'+f2(nd)+'</b></div><p class="note">'+ndviTxt(nd)+'. NIR = inframerah dekat.</p>';}
function bindRs(){panel.querySelectorAll('[data-res]').forEach(b=>b.onclick=()=>{R3.res=b.dataset.res;updCitra();rerenderRs();});
  panel.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{R3.mode=b.dataset.mode;updCitra();rerenderRs();});}
function rerenderRs(){if(scn!=='rs')return;const st=panel.scrollTop;if(current)select(current,true);else{renderInfo(OV.rs,false,liveRs(),ndviTable());bindRs();}panel.scrollTop=st;}
function ndviTable(){return '<h2>Rumus NDVI</h2><div class="formula">NDVI = (NIR − Merah) ÷ (NIR + Merah)</div><h2>Arti nilai NDVI</h2>'+legHtml([['#2166ac','Air atau awan','< 0'],['#d6c8a0','Lahan terbuka, terbangun','0 – 0,2'],['#c9cf62','Vegetasi jarang','0,2 – 0,5'],['#2f7d32','Vegetasi rapat','> 0,5']]);}

const DOCK={ovl:[['merge','Jalankan Overlay']],buf:[['bufG','Buffer Gunung'],['bufR','Buffer Sungai'],['query','Query Kepadatan'],['net','Analisis Jaringan'],['interp','Interpolasi Hujan']],rs:[['show','Tampilkan Citra']]};
function buildDock(){const d=$('#dock');d.innerHTML='';
  DOCK[scn].forEach(a=>{const b=document.createElement('button');b.className='act';b.textContent=a[1];b.dataset.k=a[0];
    b.onclick=()=>{if(a[0]==='merge')setMerged(!S.merged);else if(a[0]==='show'){R3.show=!R3.show;citra.visible=frame.visible=R3.show;syncDock();}
      else{S[a[0]]=!S[a[0]];if(a[0]==='bufG'&&S.bufG)fly([V[0]+4,15,V[1]+13],[V[0]+2,0.5,V[1]+1]);updBuf();if(current)select(current,true);else showBufOverview();}};d.appendChild(b);});
  [['Kuis',startQuiz],['Layar kelas',()=>{try{if(document.fullscreenElement)document.exitFullscreen();else stage.requestFullscreen().catch(()=>{});}catch(e){}}]].forEach(a=>{const b=document.createElement('button');b.className='act';b.textContent=a[0];b.onclick=a[1];d.appendChild(b);});
  syncDock();}
function syncDock(){document.querySelectorAll('#dock [data-k]').forEach(b=>{const k=b.dataset.k;
  if(k==='merge'){b.textContent=S.merged?'Pisahkan Layer':'Jalankan Overlay';b.setAttribute('aria-pressed',S.merged?'true':'false');}
  else if(k==='show')b.setAttribute('aria-pressed',R3.show?'true':'false');else b.setAttribute('aria-pressed',S[k]?'true':'false');});}
function showBufOverview(){renderInfo(OV.buf,false,liveBuf());bindBuf();}
function highlight(id){Object.values(hsEls).forEach(s=>s.el.classList.toggle('on',s.id===id));}

function select(id,keepCam){
  current=id;highlight(id);
  if(!id){if(scn==='ovl'){renderInfo(OV.ovl,false,liveOvl());bindOvl();}else if(scn==='buf')showBufOverview();else{renderInfo(OV.rs,false,liveRs(),ndviTable());bindRs();}
    if(!keepCam)fly(...HOMES[scn]);return;}
  const s=hsEls[id];if(s.sc!==scn)setScene(s.sc,true);current=id;highlight(id);
  if(s.sc==='ovl'){
    if(id==='hasil'){if(!S.merged){S.merged=true;mergeTarget=1;syncDock();}}else if(S.merged){S.merged=false;mergeTarget=0;syncDock();}
    let post='';if(s.L>=0&&s.id!=='dem')post='<h2>Kelas dan skor</h2>'+legHtml(LAYERS[s.L].leg);if(s.id==='dem')post='<h2>Legenda</h2>'+legHtml(LAYERS[3].leg);
    if(id==='hasil')post='<h2>Kelas kerawanan</h2>'+legHtml(RESLEG);
    renderInfo(s,true,liveOvl(),post);bindOvl();
    if(!keepCam){if(id==='hasil')fly([10,13,17],[0,1,0]);else{const y=LBASE+s.L*LGAP;fly([11,y+6,16],[0,y,0]);}}
  }else if(s.sc==='buf'){
    if(!S[s.an]){S[s.an]=true;updBuf();}
    renderInfo(s,true,liveBuf());bindBuf();
    if(!keepCam){const P={kawah:[[V[0]+4,15,V[1]+13],[V[0]+2,0.5,V[1]+1]],sungai:[[1,7,8],[-1,0.5,0.5]],padat:[[9,9,14],[3,1,1.5]],evak:[[7,9,7],[2,0.6,-1]],stasiun:[[2,16,15],[0,0,0]]}[id];fly(...P);}
  }else{
    let post='';if(s.sp){const nd=(s.sp[1]-s.sp[0])/(s.sp[1]+s.sp[0]);post='<h2>Nilai pantulan contoh</h2><dl class="facts"><div><dt>Merah</dt><dd>'+f2(s.sp[0])+'</dd></div><div><dt>Inframerah dekat (NIR)</dt><dd>'+f2(s.sp[1])+'</dd></div></dl>'+
      '<div class="formula" style="margin-top:10px">NDVI = ('+f2(s.sp[1])+' − '+f2(s.sp[0])+') ÷ ('+f2(s.sp[1])+' + '+f2(s.sp[0])+') = <b>'+f2(nd)+'</b></div><p class="note">'+ndviTxt(nd)+'</p>';}
    renderInfo(s,true,liveRs(),post);bindRs();
    if(!keepCam){if(id==='satelit')fly([OX+6,9,13],[OX,6.5,0]);else{const p=s.v;fly([p.x+3,p.y+6.5,p.z+8],[p.x,p.y+1.5,p.z]);}}
  }
}
function setScene(k,silent){
  scn=k;current=null;highlight(null);
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.s===k?'true':'false'));
  RG.visible=k!=='rs';G3.visible=k==='rs';
  tMat.map=(k==='ovl'&&mergeK>0.99)?resTex:compTex;tMat.needsUpdate=true;
  VILL.forEach(v=>v.m.visible=k==='buf');
  $('#scaleNote').textContent=k==='rs'?'Lahan 600 × 400 m · tinggi bukit dibesarkan':'Wilayah 20 × 14 km · ketinggian dibesarkan';
  buildDock();updBuf();applyTheme();
  if(!silent){select(null,true);fly(...HOMES[k]);}
}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>setScene(t.dataset.s));

// probe click
const ray=new THREE.Raycaster(),mv=new THREE.Vector2();let downAt=null;
renderer.domElement.addEventListener('pointerdown',e=>{downAt=[e.clientX,e.clientY];});
renderer.domElement.addEventListener('pointerup',e=>{if(scn!=='rs'||!downAt)return;if(Math.hypot(e.clientX-downAt[0],e.clientY-downAt[1])>6)return;
  const r=renderer.domElement.getBoundingClientRect();mv.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(mv,camera);
  const hit=ray.intersectObject(R3.show?citra:G3.userData.ground)[0];if(!hit||!hit.uv)return;
  const u=hit.uv.x,v=1-hit.uv.y,f=RESF[R3.res];R3.probe={bx:Math.min(Math.ceil(IW/f)-1,Math.floor(u*IW/f)),by:Math.min(Math.ceil(IH/f)-1,Math.floor(v*IH/f))};
  probeMk.position.set(hit.point.x,hit.point.y+0.03,hit.point.z);probeMk.visible=true;
  const pe=$('#probe');if(pe)pe.innerHTML=probeHtml();});

function applyTheme(){const v=getComputedStyle(document.documentElement).getPropertyValue('--stage').trim()||'#dfe3ea';renderer.setClearColor(new THREE.Color(v));}
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);}catch(e){}
new MutationObserver(applyTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
function resize(){const w=stage.clientWidth,hh=stage.clientHeight;renderer.setSize(w,hh,false);camera.aspect=w/hh;camera.updateProjectionMatrix();}
new ResizeObserver(resize).observe(stage);resize();
$('#fallback').remove();
camera.position.set(...HOMES.ovl[0]);controls.target.set(...HOMES.ovl[1]);
setScene('ovl',true);select(null,true);
camera.position.sub(controls.target).multiplyScalar(fitK()).add(controls.target);

const clock=new THREE.Clock(),tv=new THREE.Vector3();
function proj(v,el){tv.copy(v).project(camera);const w=stage.clientWidth,hh=stage.clientHeight;const hide=tv.z>1||Math.abs(tv.x)>1.05||Math.abs(tv.y)>1.05;el.hidden=hide;
  if(!hide){el.style.left=((tv.x*.5+.5)*w)+'px';el.style.top=((-tv.y*.5+.5)*hh)+'px';}}
function loop(){
  requestAnimationFrame(loop);
  const raw=clock.getDelta(),dt=Math.min(raw,0.05),T=clock.elapsedTime,mdt=Math.min(raw,0.25);
  if(tween){tween.t=Math.min(1,tween.t+dt/1.1);const e=1-Math.pow(1-tween.t,3);camera.position.lerpVectors(tween.p0,tween.p1,e);controls.target.lerpVectors(tween.t0,tween.t1,e);if(tween.t>=1)tween=null;}
  controls.update();
  if(mergeK!==mergeTarget){const was=mergeK;mergeK=mergeTarget>mergeK?Math.min(1,mergeK+mdt/1.6):Math.max(0,mergeK-mdt/1.2);
    const wantRes=mergeK>0.99;if((was>0.99)!==wantRes&&scn==='ovl'){tMat.map=wantRes?resTex:compTex;tMat.needsUpdate=true;}}
  placeLayers();
  if(scn==='rs'){const sx=OX-8+((T*1.1)%16);sat.position.set(sx,9.5,-1.5);sat.rotation.y=0.1*Math.sin(T);
    const sc=(T*0.35)%1,sz=lerp(-H3/2,H3/2,sc);scanM.position.set(OX,CY+0.02,sz);scanM.visible=R3.show;
    const a=beamG.attributes.position;const lens=[sx,9.25,-1.5];const corners=[[OX-W3/2,sz],[OX+W3/2,sz],[OX-W3/2,sz],[OX+W3/2,sz]];
    a.setXYZ(0,...lens);a.setXYZ(1,OX-W3/2,CY,sz);a.setXYZ(2,...lens);a.setXYZ(3,OX+W3/2,CY,sz);
    a.setXYZ(4,...lens);a.setXYZ(5,OX-W3/2,R3.show?CY:0,-H3/2);a.setXYZ(6,...lens);a.setXYZ(7,OX+W3/2,R3.show?CY:0,-H3/2);a.needsUpdate=true;beam.visible=true;
    hsEls.satelit.v.set(sx,10.3,-1.5);probeMk.material.opacity=1;}
  renderer.render(scene,camera);
  Object.values(hsEls).forEach(s=>{if(s.sc!==scn){s.el.hidden=true;return;}
    if(s.sc==='ovl'){if(s.L>=0){const e=sm(0,1,mergeK);if(mergeK>0.6){s.el.hidden=true;return;}s.v.set(9.4,lerp(LBASE+s.L*LGAP,0,e)+0.15,6.6);}else s.v.set(3,hR(3,-3)+0.4,-3);}
    if(s.sc==='rs'&&s.id!=='satelit'){s.v.y=R3.show?CY+0.35:s.gy;}
    proj(s.v,s.el);});
  TAGS.forEach(t=>{if(t.sc!==scn||(t.cond&&!t.cond())){t.e.hidden=true;return;}
    if(t.li!==undefined)t.v.set(-10.2,lerp(LBASE+t.li*LGAP,0,sm(0,1,mergeK))+0.1,7);proj(t.v,t.e);});
}
loop();
})();
</script>
