.app{display:grid;gap:16px;grid-template-columns:1fr}
.stage{position:relative;border-radius:16px;overflow:hidden;background:var(--stage);height:60vh;min-height:380px;border:1px solid var(--line)}
.stage canvas{display:block;width:100%;height:100%;touch-action:none}
.stage .fallback{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--muted)}

.tabs{position:absolute;left:12px;top:12px;right:12px;display:flex;gap:6px;overflow-x:auto;z-index:2}

.hs.on{background:#fff;color:var(--accent);border-color:var(--accent);transform:scale(1.18)}

.big{font-family:var(--mono);font-size:1.7rem;line-height:1.15;font-variant-numeric:tabular-nums}

.range{width:100%;margin:4px 0 0;accent-color:var(--accent)}

  const pond=new THREE.Mesh(new THREE.CircleGeometry(0.4,24),new THREE.MeshPhongMaterial({color:0x3a8fb8}));pond.rotation.x=-Math.PI/2;pond.position.set(-6.6,hG(-6.6,4.6)+0.03,4.6);GM.add(pond);})();
// national park boundary
(function(){const pts=[];for(let a=0;a<=6.2832+0.01;a+=0.02){let lo=0,hi=7;const cx=0.15,cz=-0.35;for(let it=0;it<22;it++){const r=(lo+hi)/2,x=cx+Math.cos(a)*r,z=cz+Math.sin(a)*r;
    const inside=Math.abs(x)<7.9&&Math.abs(z)<5.4&&(km(x,z)>=GTN||(km(x,z)>=0.95&&!isTea(x,z)));if(inside)lo=r;else hi=r;}
  const x=cx+Math.cos(a)*lo,z=cz+Math.sin(a)*lo;pts.push(new THREE.Vector3(x,hG(x,z)+0.05,z));}
  const g=new THREE.BufferGeometry().setFromPoints(pts);const l=new THREE.Line(g,new THREE.LineDashedMaterial({color:0x2b8a3e,dashSize:0.25,gapSize:0.15}));l.computeLineDistances();GM.add(l);
  const tube=new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts,true),300,0.035,5,true),new THREE.MeshBasicMaterial({color:0x2b8a3e}));GM.add(tube);})();
[['Puncak Gede ± 2.958 m',PK[0]],['Puncak Pangrango ± 3.019 m',PK[1]]].forEach(a=>tag('gunung',a[0],[OG+a[1][0],a[1][2]*VX+0.5,a[1][1]],'big'));
[['Subalpin · > 2.400 m',[-1.2,-0.45]],['Montana · 1.500–2.400 m',[-2.6,-0.6]],['Submontana · 1.000–1.500 m',[-3.8,0.6]]].forEach(a=>{const x=a[1][0],z=a[1][1];tag('gunung',a[0],[OG+x,hG(x,z)+0.35,z]);});
tag('gunung','Batas taman nasional',[OG-3.4,hG(-3.4,-3.5)+0.4,-3.5],'safe');tag('gunung','Kebun teh',[OG+3.6,hG(3.6,2.4)+0.45,2.4]);tag('gunung','Kebun raya',[OG-5.6,hG(-5.6,2.8)+0.7,2.8],'safe');tag('gunung','Permukiman',[OG-2,hG(-2,4.7)+0.5,4.7]);
[['Owa jawa',[-1.2,-2.2]],['Elang jawa',[2.8,-2.4]],['Macan tutul jawa',[-3.4,-1.4]],['Edelweis jawa',[0.6,-0.5]]].forEach(a=>{const x=a[1][0],z=a[1][1];tag('gunung',a[0],[OG+x,hG(x,z)+(a[0].startsWith('Elang')?1.4:0.5),z],'trans',()=>current==='insitu'||current==='fisio');});

// =================== HOTSPOTS & SCENES ===================
const hsEls={};
const GP={iklim:[-2.6,1.2],edafik:[0.4,4.2],fisio:[0.2,0.9],biotik:[2.6,3.4],insitu:[-3.2,-2.2],exsitu:[-5.6,4.4]};
Object.keys(SPOTS).forEach(k=>SPOTS[k].forEach((s,i)=>{s.sc=k;
  if(k==='fauna'){const r=meters(s.ll[0],s.ll[1]);s.v=new THREE.Vector3(X1(s.ll[0]),Math.max(0.3,yOf(r.m)+0.3),Z1(s.ll[1]));}
  else if(k==='bioma')s.v=new THREE.Vector3(OB+bx(s.i)+TS/2-0.3,1.8,bz(s.i)+TS/2-0.3);
  else{const p=GP[s.id];s.v=new THREE.Vector3(OG+p[0],hG(p[0],p[1])+0.5,p[1]);}
  const b=document.createElement('button');b.className='hs';b.textContent=i+1;b.setAttribute('aria-label',s.name);b.onclick=()=>select(s.id);labelsEl.appendChild(b);s.el=b;hsEls[s.id]=s;}));
let tween=null;
function fitK(){return Math.max(1,Math.pow(1.45/camera.aspect,0.7));}
function fly(p,t){tween={t:0,p0:camera.position.clone(),t0:controls.target.clone(),p1:new THREE.Vector3(...p),t1:new THREE.Vector3(...t)};tween.p1.sub(tween.t1).multiplyScalar(fitK()).add(tween.t1);}
const HOMES={fauna:[[0,21,16],[0,-1,0.9]],bioma:[[OB-1.5,13,24.5],[OB-2.4,0,1.4]],gunung:[[OG+4,10,14],[OG,1.4,0]]};

let anim=null;
function seaText(){if(seaM>=-15)return 'Muka laut seperti sekarang. Pulau-pulau terpisah oleh laut.';
  if(seaM>-60)return 'Laut dangkal mulai surut. Sebagian Paparan Sunda dan Sahul mulai muncul.';
  return 'Sumatra, Jawa, dan Kalimantan menyatu dengan Asia. Papua menyatu dengan Australia. Sulawesi, Nusa Tenggara, dan Maluku tetap dikelilingi laut dalam.';}
function liveFauna(){return '<div class="live"><div class="eyebrow">Muka laut relatif terhadap sekarang</div><div class="big" id="sV">'+(seaM===0?'0':'−'+(-seaM))+'<span>m</span></div>'+
  '<input class="range" id="sR" type="range" min="-120" max="0" step="5" value="'+seaM+'" aria-label="Muka laut dalam meter" style="direction:rtl"><div class="rampl"><span>Sekarang</span><span>Puncak zaman es (± 20.000 tahun lalu)</span></div>'+
  '<p style="margin:0" id="sT">'+seaText()+'</p><button class="go" id="sPlay" style="margin-top:4px">'+(anim?'Hentikan':'Putar zaman es')+'</button></div>';}
function bindFauna(){const r=$('#sR');if(r)r.oninput=()=>{anim=null;setSea(+r.value);updSeaUI();};const p=$('#sPlay');if(p)p.onclick=()=>{anim=anim?null:{t:0};updSeaUI();};}
function updSeaUI(){const v=$('#sV');if(!v)return;v.innerHTML=(seaM===0?'0':'−'+(-seaM))+'<span>m</span>';$('#sR').value=seaM;$('#sT').textContent=seaText();$('#sPlay').textContent=anim?'Hentikan':'Putar zaman es';syncDock();}

const DOCK={fauna:[['ice','Zaman Es'],['lines','Garis Wallace & Weber'],['pins','Fauna']],bioma:[],gunung:[]};
function buildDock(){const d=$('#dock');d.innerHTML='';
  DOCK[scn].forEach(a=>{const b=document.createElement('button');b.className='act';b.textContent=a[1];b.dataset.k=a[0];
    b.onclick=()=>{if(a[0]==='ice'){anim=null;setSea(seaM<-60?0:-120);updSeaUI();}else if(a[0]==='lines')lineG.visible=!lineG.visible;else pinG.visible=!pinG.visible;syncDock();};d.appendChild(b);});
  [['Kuis',startQuiz],['Layar kelas',()=>{try{if(document.fullscreenElement)document.exitFullscreen();else stage.requestFullscreen().catch(()=>{});}catch(e){}}]].forEach(a=>{const b=document.createElement('button');b.className='act';b.textContent=a[0];b.onclick=a[1];d.appendChild(b);});
  syncDock();}
function syncDock(){document.querySelectorAll('#dock [data-k]').forEach(b=>{const k=b.dataset.k;b.setAttribute('aria-pressed',(k==='ice'?seaM<-60:k==='lines'?lineG.visible:pinG.visible)?'true':'false');});}
function highlight(id){Object.values(hsEls).forEach(s=>s.el.classList.toggle('on',s.id===id));}
function climHtml(s){return '<h2>Iklim khas</h2><dl class="facts"><div><dt>Suhu rata-rata tahunan</dt><dd>± '+String(s.c[0]).replace('-','−')+' °C</dd></div><div><dt>Curah hujan tahunan</dt><dd>± '+s.c[1].toLocaleString('id-ID')+' mm</dd></div></dl><p style="font-size:.8rem;color:var(--muted);margin:6px 0 0">Angka perkiraan untuk perbandingan.</p>';}
function select(id,keepCam){
  current=id;highlight(id);
  if(!id){if(scn==='fauna'){renderInfo(OV.fauna,false,liveFauna());bindFauna();}else renderInfo(OV[scn],false);if(!keepCam)fly(...HOMES[scn]);return;}
  const s=hsEls[id];if(s.sc!==scn)setScene(s.sc,true);current=id;highlight(id);
  if(s.sc==='fauna'){if((id==='sunda'||id==='sahul')&&seaM>-60){setSea(-120);}renderInfo(s,true,liveFauna());bindFauna();
    if(!keepCam){const p=s.v;fly([p.x+1.5,7,p.z+7],[p.x,-0.3,p.z]);}}
  else if(s.sc==='bioma'){renderInfo(s,true,null,climHtml(s));if(!keepCam)fly([OB+bx(s.i)+2,3.8,bz(s.i)+5.5],[OB+bx(s.i),0.5,bz(s.i)]);}
  else{renderInfo(s,true);if(!keepCam){const p=s.v;fly([p.x+2.5,p.y+4,p.z+6.5],[p.x,p.y-0.3,p.z]);}}
}
function setScene(k,silent){
  scn=k;current=null;highlight(null);anim=null;
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.s===k?'true':'false'));
  F.visible=k==='fauna';BM.visible=k==='bioma';GM.visible=k==='gunung';
  $('#scaleNote').textContent=k==='fauna'?'Kedalaman laut disederhanakan, skala tegak logaritmik':k==='bioma'?'Diorama tidak sesuai skala':'Model disederhanakan · ketinggian dibesarkan';
  buildDock();applyTheme();
  if(!silent){select(null,true);fly(...HOMES[k]);}
}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>setScene(t.dataset.s));
function applyTheme(){const v=getComputedStyle(document.documentElement).getPropertyValue('--stage').trim()||'#dbe5e1';renderer.setClearColor(new THREE.Color(v));}
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);}catch(e){}
new MutationObserver(applyTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
function resize(){const w=stage.clientWidth,hh=stage.clientHeight;renderer.setSize(w,hh,false);camera.aspect=w/hh;camera.updateProjectionMatrix();}
new ResizeObserver(resize).observe(stage);resize();
$('#fallback').remove();
camera.position.set(...HOMES.fauna[0]);controls.target.set(...HOMES.fauna[1]);
setScene('fauna',true);select(null,true);
camera.position.sub(controls.target).multiplyScalar(fitK()).add(controls.target);

const clock=new THREE.Clock(),tv=new THREE.Vector3();
function proj(v,el){tv.copy(v).project(camera);const w=stage.clientWidth,hh=stage.clientHeight;const hide=tv.z>1||Math.abs(tv.x)>1.05||Math.abs(tv.y)>1.05;el.hidden=hide;
  if(!hide){el.style.left=((tv.x*.5+.5)*w)+'px';el.style.top=((-tv.y*.5+.5)*hh)+'px';}}
let lastSea=0;
function loop(){
  requestAnimationFrame(loop);
  const raw=clock.getDelta(),dt=Math.min(raw,0.05);
  if(tween){tween.t=Math.min(1,tween.t+dt/1.1);const e=1-Math.pow(1-tween.t,3);camera.position.lerpVectors(tween.p0,tween.p1,e);controls.target.lerpVectors(tween.t0,tween.t1,e);if(tween.t>=1)tween=null;}
  controls.update();
  if(anim&&scn==='fauna'){anim.t+=Math.min(raw,0.25);const ph=(anim.t%12)/12,m=-Math.round(120*Math.sin(ph*Math.PI)/5)*5;if(m!==lastSea){lastSea=m;setSea(m);updSeaUI();}}
  renderer.render(scene,camera);
  Object.values(hsEls).forEach(s=>{if(s.sc!==scn){s.el.hidden=true;return;}proj(s.v,s.el);});
  TAGS.forEach(t=>{if(t.sc!==scn||(t.cond&&!t.cond())){t.e.hidden=true;return;}proj(t.v,t.e);});
}
loop();
})();
