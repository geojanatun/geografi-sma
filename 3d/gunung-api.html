<style>
/* Layout: panggung 3D lebar di kiri, panel materi di kanan (bertumpuk di HP) */
:root{
  --bg:#eceee9; --surface:#fbfbf8; --fg:#1b201d; --muted:#5b655e; --line:#d3d8d0;
  --accent:#c4471a; --accent-soft:#f5e0d4; --stage:#dde2da;
  --krb3:#c8321e; --krb2:#e3862a; --krb1:#e3c03b;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101412; --surface:#181d1a; --fg:#e5eae6; --muted:#97a29a; --line:#2a322d;
  --accent:#ff7c40; --accent-soft:#3a2218; --stage:#141916; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101412; --surface:#181d1a; --fg:#e5eae6; --muted:#97a29a; --line:#2a322d;
  --accent:#ff7c40; --accent-soft:#3a2218; --stage:#141916; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-bottom:12px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:1.15rem;letter-spacing:-.01em}
.brand svg{width:30px;height:30px}
.crumbs{display:flex;gap:6px;font-size:.85rem;color:var(--muted);flex-wrap:wrap;min-width:0}
.crumbs span+span::before{content:"›";margin-right:6px;opacity:.6}
.top .spacer{flex:1}
.pill{font-family:var(--mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}

.app{display:grid;gap:16px;grid-template-columns:1fr}
.stage{position:relative;border-radius:16px;overflow:hidden;background:var(--stage);height:58vh;min-height:360px;border:1px solid var(--line)}
.stage canvas{display:block;width:100%;height:100%;touch-action:none}
.stage .fallback{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--muted)}

.hs{position:absolute;left:0;top:0;width:32px;height:32px;margin:-16px 0 0 -16px;border-radius:50%;
  border:2px solid #fff;background:var(--accent);color:#fff;font-family:var(--mono);font-size:.85rem;font-weight:500;
  display:grid;place-items:center;box-shadow:0 2px 10px rgba(0,0,0,.35);transition:transform .15s}
.hs:hover{transform:scale(1.12)}
.hs.inside{background:rgba(20,20,20,.55);border-style:dashed}
.hs.on{background:#fff;color:var(--accent);border-color:var(--accent);transform:scale(1.18)}
.hs[hidden]{display:none!important}

.parts{position:absolute;left:12px;top:12px;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(8px);
  border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:200px;display:none}
.parts h3{margin:0 0 6px;font-family:var(--mono);font-size:.68rem;letter-spacing:.1em;color:var(--muted);font-weight:500}
.parts ol{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.parts button{display:flex;gap:8px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:5px 6px;border-radius:8px;font-size:.9rem}
.parts button:hover,.parts button.on{background:var(--accent-soft)}
.parts b{font-family:var(--mono);font-weight:500;color:var(--accent);font-size:.8rem;width:14px}

.dock{position:absolute;left:0;right:0;bottom:0;padding:10px 12px;display:flex;gap:8px;overflow-x:auto;
  background:linear-gradient(transparent,color-mix(in srgb,var(--stage) 85%,transparent) 40%)}
.act{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:99px;border:1px solid var(--line);
  background:var(--surface);font-size:.9rem;font-weight:700;white-space:nowrap}
.act svg{width:18px;height:18px}
.act[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.hint{position:absolute;right:12px;top:12px;font-size:.78rem;color:var(--muted);background:color-mix(in srgb,var(--surface) 80%,transparent);padding:4px 10px;border-radius:99px}
.legend{position:absolute;right:12px;top:44px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:.8rem;display:grid;gap:4px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 22px 26px;min-width:0}
.eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.12em;color:var(--accent);text-transform:uppercase}
.panel h1{font-family:var(--display);font-weight:800;font-size:clamp(2rem,4vw,2.6rem);line-height:1.02;letter-spacing:-.025em;margin:6px 0 4px;text-wrap:balance}
.tag{font-family:var(--display);font-weight:500;font-size:1.1rem;color:var(--muted);margin:0 0 12px}
.desc{margin:0 0 18px;max-width:62ch}
.panel h2{font-family:var(--mono);font-weight:500;font-size:.72rem;letter-spacing:.12em;color:var(--muted);margin:20px 0 8px;text-transform:uppercase}
.facts{margin:0;display:grid;border-top:1px solid var(--line)}
.facts div{display:grid;grid-template-columns:minmax(110px,40%) 1fr;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.facts dt{color:var(--muted);font-size:.9rem}
.facts dd{margin:0;font-weight:700;font-variant-numeric:tabular-nums}
.flow{list-style:none;margin:0;padding:0;display:grid;gap:0}
.flow li{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;position:relative;padding-bottom:10px}
.flow li::before{content:counter(f);counter-increment:f;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--accent);color:var(--accent);
  font-family:var(--mono);font-size:.78rem;display:grid;place-items:center;background:var(--surface);position:relative;z-index:1}
.flow{counter-reset:f}
.flow li:not(:last-child)::after{content:"";position:absolute;left:13px;top:26px;bottom:0;border-left:1.5px dashed var(--line)}
.flow li span{padding-top:2px}
.know{margin-top:20px;background:var(--accent-soft);border-radius:12px;padding:14px 16px}
.know strong{display:block;font-family:var(--display);font-size:1rem;margin-bottom:4px;color:var(--accent)}
.know p{margin:0}
.kur{margin-top:18px;font-family:var(--mono);font-size:.7rem;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.back{background:none;border:0;padding:0;color:var(--accent);font-weight:700;font-size:.9rem;margin-bottom:10px}
.go{margin-top:14px;display:inline-flex;gap:8px;align-items:center;border:0;background:var(--accent);color:#fff;font-weight:700;padding:10px 16px;border-radius:10px}

.quiz .q{font-family:var(--display);font-weight:700;font-size:1.25rem;line-height:1.25;margin:4px 0 14px;text-wrap:balance}
.opts{display:grid;gap:8px}
.opt{text-align:left;padding:11px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface)}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.ok{border-color:#2e8b57;background:color-mix(in srgb,#2e8b57 14%,var(--surface))}
.opt.no{border-color:#c0392b;background:color-mix(in srgb,#c0392b 12%,var(--surface))}
.opt:disabled{cursor:default}
.fb{margin-top:12px;font-size:.95rem}
.bar{height:6px;border-radius:9px;background:var(--line);overflow:hidden;margin:10px 0 4px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.score{font-family:var(--display);font-weight:800;font-size:3.4rem;line-height:1;color:var(--accent)}

@media (min-width:900px){
  html,body{height:100%}
  body{display:flex;flex-direction:column}
  .app{flex:1;min-height:0;grid-template-columns:minmax(0,1fr) 400px}
  .stage{height:auto;min-height:0}
  .panel{overflow-y:auto}
  .parts{display:block}
}
@media (prefers-reduced-motion:reduce){.hs,.bar i{transition:none}}

<script>
(function(){
const KUR='Kurikulum Merdeka · Geografi Fase E (Dinamika Litosfer) · Fase F (Mitigasi Bencana)';
const OVERVIEW={eyebrow:'Bentang alam · Vulkanisme',name:'Gunung Api',tag:'Jendela ke perut bumi',
 desc:'Bukaan di kerak bumi tempat magma, gas, dan material vulkanik keluar ke permukaan. Indonesia berada di Cincin Api Pasifik dan di pertemuan tiga lempeng besar, sehingga memiliki banyak gunung api aktif.',
 facts:[['Gunung api aktif di Indonesia','± 127'],['Penyebab utama','Subduksi lempeng'],['Tipe paling umum','Strato (kerucut berlapis)'],['Tertinggi di Jawa','Semeru, 3.676 m']],
 flow:['Dapur magma terisi magma dan gas','Tekanan naik, magma menerobos pipa kepundan','Magma mencapai kawah','Erupsi: abu, lava, awan panas keluar'],
 tahu:'Letusan Tambora tahun 1815 melontarkan begitu banyak abu ke atmosfer sehingga tahun 1816 dikenal sebagai "tahun tanpa musim panas" di Eropa dan Amerika Utara.'};

const SPOTS=[
 {id:'kawah',name:'Kawah',eyebrow:'Struktur · Puncak',tag:'Mulut gunung api',
  desc:'Cekungan di puncak tempat gas, abu, dan lava keluar saat erupsi. Bentuknya seperti corong. Bila terisi air hujan, kawah bisa menjadi danau kawah.',
  facts:[['Letak','Puncak, ujung atas pipa kepundan'],['Ukuran','Puluhan meter hingga beberapa km'],['Contoh','Kawah Ratu (Tangkuban Parahu), Kawah Ijen']],
  tahu:'Danau Kawah Ijen termasuk danau paling asam di dunia, dengan pH di bawah 1. Gas belerang yang terbakar di malam hari tampak sebagai "api biru".',
  pos:[0,4.3,0],cam:[5,11,8],tgt:[0,4,0]},
 {id:'pipa',name:'Pipa Kepundan',eyebrow:'Struktur · Dalam',tag:'Jalur naiknya magma',cut:1,
  desc:'Saluran sempit yang menghubungkan dapur magma dengan kawah. Ketika tekanan gas dalam magma meningkat, magma terdorong naik melalui saluran ini.',
  facts:[['Nama lain','Diatrema, saluran magma'],['Isi','Magma dan gas vulkanik'],['Setelah erupsi','Magma membeku menjadi sumbat lava']],
  tahu:'Sumbat lava yang tertinggal di pipa kepundan dapat menahan gas di bawahnya, sehingga letusan berikutnya bisa lebih eksplosif.',
  pos:[0,1.4,0],cam:[12,3,3],tgt:[0,1.2,0]},
 {id:'dapur',name:'Dapur Magma',eyebrow:'Struktur · Bawah permukaan',tag:'Sumber tenaga erupsi',cut:1,
  desc:'Kantong batuan cair (magma) di bawah gunung api. Magma berasal dari batuan mantel atau kerak yang meleleh, lalu terkumpul di sini sebelum naik ke permukaan.',
  facts:[['Kedalaman','Umumnya 1–10 km'],['Suhu magma','± 700–1.200 °C'],['Penyusun','Silikat cair, kristal, gas (H₂O, CO₂, SO₂)']],
  tahu:'Gempa vulkanik dan menggembungnya tubuh gunung menandakan magma sedang bergerak naik. PVMBG memantaunya dengan seismometer dan alat ukur deformasi.',
  pos:[0,-3.2,0],cam:[13,0,4],tgt:[0,-2.4,0]},
 {id:'strato',name:'Lapisan Strato',eyebrow:'Struktur · Tubuh gunung',tag:'Kue lapis dari letusan',cut:1,
  desc:'Tubuh gunung api strato tersusun dari lapisan lava dan material piroklastik (abu, pasir, kerikil, bom vulkanik) yang berselang-seling, satu lapis untuk tiap periode letusan.',
  facts:[['Bentuk','Kerucut tinggi, lereng curam'],['Contoh','Merapi, Semeru, Sindoro'],['Tipe lain','Perisai (landai), maar (kawah dangkal)']],
  tahu:'Sebagian besar gunung api di Indonesia bertipe strato karena terbentuk di zona subduksi, tempat magmanya kental dan kaya gas.',
  pos:null,cam:[10,4,8],tgt:[0,2,2.6]},
 {id:'lava',name:'Aliran Lava',eyebrow:'Material · Erupsi',tag:'Batu cair yang mengalir',
  desc:'Magma yang sudah keluar ke permukaan disebut lava. Lava mengalir menuruni lereng mengikuti lembah, lalu mendingin dan membeku menjadi batuan beku.',
  facts:[['Suhu','± 700–1.200 °C'],['Kecepatan','Umumnya lambat'],['Jauh lebih cepat','Awan panas, bisa > 100 km/jam']],
  tahu:'Bahaya paling mematikan dari gunung api biasanya bukan lava, melainkan awan panas (aliran piroklastik) dan lahar yang bergerak jauh lebih cepat.',
  pos:null,cam:[5,8,13],tgt:null},
 {id:'krb',name:'Kawasan Rawan Bencana',eyebrow:'Mitigasi · Tata ruang',tag:'Peta untuk menyelamatkan diri',krb:1,
  desc:'PVMBG membagi wilayah sekitar gunung api menjadi zona KRB berdasarkan tingkat bahaya. Peta ini menjadi dasar penataan permukiman dan jalur evakuasi.',
  facts:[['KRB III','Paling dekat puncak, tidak untuk hunian tetap'],['KRB II','Berpotensi awan panas, lontaran batu, hujan abu lebat'],['KRB I','Berpotensi lahar dan hujan abu'],['Status aktivitas','Normal → Waspada → Siaga → Awas']],
  tahu:'Lahar bisa datang bertahun-tahun setelah letusan: hujan deras mengangkut endapan abu di lereng menjadi banjir lumpur yang menerjang lembah sungai.',
  pos:null,cam:[2,21,10],tgt:[0,0,0]}
];

const QUIZ=[
 {q:'Tempat magma berkumpul di bawah gunung api sebelum naik ke permukaan disebut…',o:['Kawah','Dapur magma','Pipa kepundan','Kaldera'],a:1,e:'Dapur magma adalah kantong magma, umumnya 1–10 km di bawah permukaan.'},
 {q:'Saluran yang menghubungkan dapur magma dengan kawah adalah…',o:['Pipa kepundan','Sill','Lembah lava','Retakan lempeng'],a:0,e:'Pipa kepundan (diatrema) adalah jalur naiknya magma ke kawah.'},
 {q:'Gunung api yang tubuhnya tersusun dari lapisan lava dan piroklastik berselang-seling bertipe…',o:['Perisai','Maar','Strato','Kaldera'],a:2,e:'Gunung strato seperti Merapi dan Semeru tersusun berlapis-lapis.'},
 {q:'Zona yang tidak boleh dijadikan hunian tetap adalah…',o:['KRB I','KRB II','KRB III','Di luar KRB'],a:2,e:'KRB III paling dekat puncak dan paling sering terlanda awan panas serta lontaran batu.'},
 {q:'Urutan status aktivitas gunung api dari yang terendah adalah…',o:['Waspada – Normal – Siaga – Awas','Normal – Waspada – Siaga – Awas','Normal – Siaga – Waspada – Awas','Siaga – Waspada – Awas – Normal'],a:1,e:'Level I Normal, II Waspada, III Siaga, IV Awas.'},
 {q:'Bahaya vulkanik yang bisa melaju lebih dari 100 km/jam adalah…',o:['Aliran lava','Hujan abu','Awan panas','Gas belerang'],a:2,e:'Awan panas (aliran piroklastik) sangat cepat dan panas, sehingga paling mematikan.'}
];

const $=s=>document.querySelector(s);
const panel=$('#panel');
let current=null;
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function renderInfo(d,isSpot){
  let h='';
  if(isSpot) h+='<button class="back" id="pBack">← Ringkasan modul</button>';
  h+='<div class="eyebrow">'+esc(d.eyebrow)+'</div><h1>'+esc(d.name)+'</h1><p class="tag">'+esc(d.tag)+'</p><p class="desc">'+esc(d.desc)+'</p>';
  h+='<h2>Fakta kunci</h2><dl class="facts">'+d.facts.map(f=>'<div><dt>'+esc(f[0])+'</dt><dd>'+esc(f[1])+'</dd></div>').join('')+'</dl>';
  if(d.flow) h+='<h2>Jalur magma</h2><ol class="flow">'+d.flow.map(f=>'<li><span>'+esc(f)+'</span></li>').join('')+'</ol>';
  h+='<div class="know"><strong>Tahukah kamu?</strong><p>'+esc(d.tahu)+'</p></div>';
  if(!isSpot) h+='<button class="go" id="pQuiz">Uji pemahaman · '+QUIZ.length+' soal</button>';
  h+='<div class="kur">'+KUR+'</div>';
  panel.innerHTML=h;panel.scrollTop=0;
  const b=$('#pBack'); if(b) b.onclick=()=>select(null);
  const q=$('#pQuiz'); if(q) q.onclick=startQuiz;
}

let qi=0,qs=0;
function startQuiz(){qi=0;qs=0;showQ();}
function showQ(){
  if(qi>=QUIZ.length){
    const msg=qs===QUIZ.length?'Sempurna! Kamu menguasai struktur dan mitigasi gunung api.':qs>=4?'Bagus. Ulangi titik yang masih keliru di model 3D.':'Jelajahi lagi titik-titik di model, lalu coba ulang.';
    panel.innerHTML='<div class="quiz"><div class="eyebrow">Kuis · Hasil</div><p class="score">'+qs+'/'+QUIZ.length+'</p><p class="desc" style="margin-top:12px">'+msg+'</p><button class="go" id="qAgain">Ulangi kuis</button> <button class="back" id="qBack" style="margin-left:12px">Kembali ke materi</button></div>';
    $('#qAgain').onclick=startQuiz;$('#qBack').onclick=()=>select(null);return;
  }
  const Q=QUIZ[qi];
  panel.innerHTML='<div class="quiz"><button class="back" id="qBack">← Kembali ke materi</button><div class="eyebrow">Kuis · Soal '+(qi+1)+' dari '+QUIZ.length+'</div><div class="bar"><i style="width:'+(qi/QUIZ.length*100)+'%"></i></div><p class="q">'+esc(Q.q)+'</p><div class="opts">'+
    Q.o.map((o,i)=>'<button class="opt" id="opt'+i+'" data-i="'+i+'">'+String.fromCharCode(65+i)+'. '+esc(o)+'</button>').join('')+'</div><div class="fb" id="fb"></div></div>';
  $('#qBack').onclick=()=>select(null);
  panel.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i;
    panel.querySelectorAll('.opt').forEach(x=>x.disabled=true);
    $('#opt'+Q.a).classList.add('ok');
    if(i===Q.a){qs++;$('#fb').innerHTML='<strong>Benar.</strong> '+esc(Q.e);}
    else{b.classList.add('no');$('#fb').innerHTML='<strong>Belum tepat.</strong> '+esc(Q.e);}
    $('#fb').innerHTML+='<br><button class="go" id="qNext">'+(qi+1<QUIZ.length?'Soal berikutnya':'Lihat hasil')+'</button>';
    $('#qNext').onclick=()=>{qi++;showQ();};
  });
}
$('#aQuiz').onclick=startQuiz;

// parts list
$('#partsList').innerHTML=SPOTS.map((s,i)=>'<li><button data-id="'+s.id+'"><b>'+(i+1)+'</b>'+esc(s.name)+'</button></li>').join('');
$('#partsList').addEventListener('click',e=>{const b=e.target.closest('button');if(b)select(b.dataset.id);});

renderInfo(OVERVIEW,false);

if(!window.THREE){$('#fallback').textContent='Model 3D tidak dapat dimuat. Pastikan perangkat mendukung WebGL, lalu muat ulang halaman.';return;}
$('#fallback').remove();

// ---------- terrain ----------
const R=8.2,RC=1.2;
function coneH(r){return r<R?6.2*Math.pow(1-Math.max(r,RC)/R,1.55):0;}
function h(x,z){
  const r=Math.hypot(x,z),a=Math.atan2(z,x);
  let v=coneH(r);
  if(r<RC) v-=1.1*(1-(r/RC)*(r/RC));
  if(r<R) v+=0.22*Math.sin(a*11+r*0.6)*Math.sin(Math.min(1,r/R)*Math.PI)*0.9;
  const edge=Math.max(0,Math.min(1,(10-Math.abs(x))/1.6,(10-Math.abs(z))/1.6));
  const g=0.09*(1+Math.sin(x*0.7+1.3)*Math.cos(z*0.6-0.4))+0.03*(1+Math.sin(x*2.1)*Math.sin(z*1.7));
  return v+g*edge;
}

const stage=$('#stage');
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.localClippingEnabled=true;
stage.prepend(renderer.domElement);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(42,1,0.1,200);
camera.position.set(15,9,15);
const controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.target.set(0,1,0);controls.enableDamping=true;controls.minDistance=5;controls.maxDistance=40;controls.maxPolarAngle=Math.PI*0.6;controls.autoRotateSpeed=0.8;
controls.addEventListener('start',()=>{tween=null;$('#hint').hidden=true;});

scene.add(new THREE.HemisphereLight(0xf4f1ea,0x4a4038,0.75));
const sun=new THREE.DirectionalLight(0xffffff,0.85);sun.position.set(-6,12,9);scene.add(sun);
const glowLight=new THREE.PointLight(0xff6a1a,0,14);glowLight.position.set(0,4.6,0);scene.add(glowLight);

const clip=new THREE.Plane(new THREE.Vector3(-1,0,0),0);

const SEG=170;
const tg=new THREE.PlaneGeometry(20,20,SEG,SEG);tg.rotateX(-Math.PI/2);
const tp=tg.attributes.position;
for(let i=0;i<tp.count;i++){tp.setY(i,h(tp.getX(i),tp.getZ(i)));}
tg.computeVertexNormals();
const cols=new Float32Array(tp.count*3);tg.setAttribute('color',new THREE.BufferAttribute(cols,3));
const C=(hex)=>new THREE.Color(hex);
const cGrass=C(0x5f8a48),cGrass2=C(0x7c9a52),cRock=C(0x8a6d50),cAsh=C(0x7d7671),cCrater=C(0x3d3734);
const cK3=C(0xc8321e),cK2=C(0xe3862a),cK1=C(0xe3c03b);
function paint(krb){
  const t=new THREE.Color();
  for(let i=0;i<tp.count;i++){
    const x=tp.getX(i),y=tp.getY(i),z=tp.getZ(i),r=Math.hypot(x,z);
    if(r<RC) t.copy(cCrater).lerp(cAsh,Math.max(0,(y-3.7)/1.2));
    else if(y>3.4) t.copy(cRock).lerp(cAsh,Math.min(1,(y-3.4)/1.2));
    else if(y>1.6) t.copy(cGrass).lerp(cRock,(y-1.6)/1.8);
    else t.copy(cGrass2).lerp(cGrass,Math.min(1,y/1.6));
    const n=0.94+0.06*Math.sin(x*5.3)*Math.cos(z*4.7);t.multiplyScalar(n);
    if(krb){const k=r<2.8?cK3:r<5?cK2:r<7.3?cK1:null;if(k)t.lerp(k,0.68);}
    cols[i*3]=t.r;cols[i*3+1]=t.g;cols[i*3+2]=t.b;
  }
  tg.attributes.color.needsUpdate=true;
}
paint(false);
const tMat=new THREE.MeshLambertMaterial({vertexColors:true,side:THREE.DoubleSide});
scene.add(new THREE.Mesh(tg,tMat));

// strata colors for underground
function strata(y){
  if(y>-0.6) return [118,86,58];
  if(y>-2.2){const b=Math.floor((-y-0.6)/0.4)%2;return b?[176,150,110]:[160,134,96];}
  return [104,104,108];
}
function sideTex(){
  const c=document.createElement('canvas');c.width=16;c.height=256;const x=c.getContext('2d');
  for(let p=0;p<256;p++){const y=-p/256*5;const s=strata(y);x.fillStyle='rgb('+s+')';x.fillRect(0,p,16,1);}
  const t=new THREE.CanvasTexture(c);return t;
}
const st=sideTex();
const sideM=new THREE.MeshLambertMaterial({map:st,clippingPlanes:[]});
const plainM=new THREE.MeshLambertMaterial({color:0x6f6a64,clippingPlanes:[]});
const box=new THREE.Mesh(new THREE.BoxGeometry(20,5,20),[sideM,sideM,plainM,plainM,sideM,sideM]);
box.position.y=-2.5;scene.add(box);

// cross-section texture
const W=1024,HC=600,Y0=6.5,YS=11.5;
function makeSection(glow){
  const c=document.createElement('canvas');c.width=W;c.height=HC;const ctx=c.getContext('2d');
  const img=ctx.createImageData(W,HC),d=img.data;
  for(let px=0;px<W;px++){
    const z=10-px/W*20,s=h(0,z),cone=coneH(Math.abs(z));
    for(let py=0;py<HC;py++){
      const y=Y0-py/HC*YS,k=(py*W+px)*4;let col=null,a=255;
      const mag=(z/2.4)**2+((y+3.2)/1.0)**2;
      const inCond=Math.abs(z)<0.3+0.05*Math.sin(y*2)&&y>-2.5&&y<=s;
      if(y>s){d[k+3]=0;continue;}
      if(mag<1){const f=Math.sqrt(mag);col=[255,210-f*120,90-f*70];}
      else if(inCond){const f=Math.abs(z)/0.32;col=[250,180-f*90,70-f*40];}
      else if(glow){d[k+3]=0;continue;}
      else if(s-y<0.06){col=[60,48,40];}
      else if(y>=0&&cone>0.15){const b=Math.floor((s-y)/0.42)%2;col=b?[168,142,110]:[78,72,68];
        if(Math.abs(z)<1.2&&y>2.5)col=[70,62,58];}
      else if(y>=0){col=[118,86,58];}
      else col=strata(y);
      if(glow){a=mag<1?Math.max(0,255*(1-mag)):200;}
      const n=glow?1:0.93+0.07*Math.sin(px*0.9+py*1.7)*Math.cos(py*0.5);
      d[k]=col[0]*n;d[k+1]=col[1]*n;d[k+2]=col[2]*n;d[k+3]=a;
    }
  }
  ctx.putImageData(img,0,0);
  const t=new THREE.CanvasTexture(c);return t;
}
const secGeo=new THREE.PlaneGeometry(20,YS);secGeo.rotateY(Math.PI/2);
const sec=new THREE.Mesh(secGeo,new THREE.MeshBasicMaterial({map:makeSection(false),transparent:true,side:THREE.DoubleSide,alphaTest:0.5}));
sec.position.set(0.002,Y0-YS/2,0);sec.visible=false;scene.add(sec);
const glowM=new THREE.MeshBasicMaterial({map:makeSection(true),transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,opacity:0.3});
const glowP=new THREE.Mesh(secGeo,glowM);glowP.position.set(0.01,Y0-YS/2,0);glowP.visible=false;scene.add(glowP);

// lava ribbon
const dir=new THREE.Vector2(-0.33,1).normalize(),perp=new THREE.Vector2(dir.y,-dir.x);
function lavaAt(t){const o=0.35*Math.sin(t*1.25);const x=dir.x*t+perp.x*o,z=dir.y*t+perp.y*o;return [x,h(x,z)+0.05,z];}
const LN=90,lp=[],luv=[],lidx=[];
for(let i=0;i<=LN;i++){
  const t=1.25+i/LN*6.4,w=0.16+0.16*(t/7.6),o=0.35*Math.sin(t*1.25);
  for(const sgn of [-1,1]){const x=dir.x*t+perp.x*(o+sgn*w),z=dir.y*t+perp.y*(o+sgn*w);lp.push(x,h(x,z)+0.05,z);luv.push(sgn<0?0:1,t*0.6);}
  if(i<LN){const a=i*2;lidx.push(a,a+1,a+2,a+1,a+3,a+2);}
}
const lg=new THREE.BufferGeometry();lg.setAttribute('position',new THREE.Float32BufferAttribute(lp,3));lg.setAttribute('uv',new THREE.Float32BufferAttribute(luv,2));lg.setIndex(lidx);
const lc=document.createElement('canvas');lc.width=32;lc.height=128;const lx=lc.getContext('2d');
for(let p=0;p<128;p++){const f=0.5+0.5*Math.sin(p/128*Math.PI*6);lx.fillStyle='rgb(255,'+Math.round(90+f*130)+','+Math.round(20+f*40)+')';lx.fillRect(0,p,32,1);}
lx.fillStyle='rgba(90,20,10,.55)';for(let i=0;i<40;i++)lx.fillRect(Math.random()*32,Math.random()*128,6+Math.random()*10,2);
const ltex=new THREE.CanvasTexture(lc);ltex.wrapS=ltex.wrapT=THREE.RepeatWrapping;
const lMat=new THREE.MeshBasicMaterial({map:ltex,color:0x4a4442,side:THREE.DoubleSide,polygonOffset:true,polygonOffsetFactor:-2});
scene.add(new THREE.Mesh(lg,lMat));

// particles
function dotTex(){const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d');const g=x.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(0,0,64,64);return new THREE.CanvasTexture(c);}
const dt=dotTex();
const AN=520,ap=new Float32Array(AN*3),av=new Float32Array(AN*3),al=new Float32Array(AN);
function spawnAsh(i){ap[i*3]=(Math.random()-.5)*.6;ap[i*3+1]=4.2;ap[i*3+2]=(Math.random()-.5)*.6;
  av[i*3]=(Math.random()-.5)*.7;av[i*3+1]=1.8+Math.random()*1.8;av[i*3+2]=(Math.random()-.5)*.7;al[i]=Math.random()*4.5;}
for(let i=0;i<AN;i++){spawnAsh(i);ap[i*3+1]=-50;}
const ag=new THREE.BufferGeometry();ag.setAttribute('position',new THREE.BufferAttribute(ap,3));
const ash=new THREE.Points(ag,new THREE.PointsMaterial({size:1.5,map:dt,color:0x8b8580,transparent:true,opacity:.5,depthWrite:false}));ash.visible=false;scene.add(ash);
const BN=90,bp=new Float32Array(BN*3),bv=new Float32Array(BN*3);
function spawnB(i){bp[i*3]=0;bp[i*3+1]=4;bp[i*3+2]=0;const a=Math.random()*6.28,s=0.6+Math.random()*1.6;bv[i*3]=Math.cos(a)*s;bv[i*3+1]=3+Math.random()*3.5;bv[i*3+2]=Math.sin(a)*s;}
for(let i=0;i<BN;i++){spawnB(i);bp[i*3+1]=-50;}
const bg=new THREE.BufferGeometry();bg.setAttribute('position',new THREE.BufferAttribute(bp,3));
const bombs=new THREE.Points(bg,new THREE.PointsMaterial({size:.35,map:dt,color:0xffa040,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending}));bombs.visible=false;scene.add(bombs);

// hotspot positions
SPOTS[3].pos=[0,h(0,2.7)-0.7,2.7];
SPOTS[4].pos=lavaAt(4.2);SPOTS[4].pos[1]+=0.15;SPOTS[4].tgt=lavaAt(4.2);
SPOTS[5].pos=[-1.2,h(-1.2,5.6)+0.1,5.6];
const spotsEl=$('#spots');
SPOTS.forEach((s,i)=>{const b=document.createElement('button');b.className='hs';b.textContent=i+1;b.setAttribute('aria-label',s.name);b.id='hs-'+s.id;
  b.onclick=()=>select(s.id);spotsEl.appendChild(b);s.el=b;s.v=new THREE.Vector3(...s.pos);});

// state
const state={erupt:false,cut:false,krb:false};
function setBtn(id,on){$(id).setAttribute('aria-pressed',on?'true':'false');}
function setCut(on){state.cut=on;setBtn('#aCut',on);const cp=on?[clip]:[];tMat.clippingPlanes=cp;sideM.clippingPlanes=cp;plainM.clippingPlanes=cp;lMat.clippingPlanes=cp;
  tMat.needsUpdate=sideM.needsUpdate=plainM.needsUpdate=lMat.needsUpdate=true;sec.visible=on;glowP.visible=on;}
function setKrb(on){state.krb=on;setBtn('#aKrb',on);paint(on);$('#legend').hidden=!on;}
function setErupt(on){state.erupt=on;setBtn('#aErupt',on);ash.visible=on;bombs.visible=on;
  if(on){for(let i=0;i<AN;i++){spawnAsh(i);al[i]=Math.random()*4.5;ap[i*3+1]=4.2+Math.random()*0.2;}for(let i=0;i<BN;i++)spawnB(i);}}
$('#aCut').onclick=()=>{setCut(!state.cut);if(state.cut)fly([13,3,5],[0,0,0]);};
$('#aKrb').onclick=()=>{setKrb(!state.krb);if(state.krb)fly([2,21,10],[0,0,0]);};
$('#aErupt').onclick=()=>{setErupt(!state.erupt);if(state.erupt&&!current)fly([14,10,17],[0,4,0]);};
$('#aRot').onclick=()=>{controls.autoRotate=!controls.autoRotate;setBtn('#aRot',controls.autoRotate);};
$('#aFull').onclick=()=>{try{if(document.fullscreenElement)document.exitFullscreen();else stage.requestFullscreen().catch(()=>{});}catch(e){}};

let tween=null;
function fly(pos,tgt){tween={t:0,p0:camera.position.clone(),t0:controls.target.clone(),p1:new THREE.Vector3(...pos),t1:new THREE.Vector3(...tgt)};tween.p1.sub(tween.t1).multiplyScalar(fitK()).add(tween.t1);}
function fitK(){return Math.max(1,Math.pow(1.45/camera.aspect,0.7));}

function select(id){
  current=id;
  SPOTS.forEach(s=>s.el.classList.toggle('on',s.id===id));
  document.querySelectorAll('#partsList button').forEach(b=>b.classList.toggle('on',b.dataset.id===id));
  if(!id){renderInfo(OVERVIEW,false);fly([15,9,15],[0,1,0]);return;}
  const s=SPOTS.find(x=>x.id===id);
  if(s.cut&&!state.cut)setCut(true);
  if(s.krb&&!state.krb)setKrb(true);
  if(s.id==='lava'&&!state.erupt)setErupt(true);
  renderInfo(s,true);
  const t=s.tgt||s.pos;fly(s.id==='lava'?[t[0]+7,t[1]+6,t[2]+9]:s.cam,t);
}

// theme
function applyTheme(){const v=getComputedStyle(document.documentElement).getPropertyValue('--stage').trim()||'#dde2da';renderer.setClearColor(new THREE.Color(v));}
applyTheme();
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);}catch(e){}
new MutationObserver(applyTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

function resize(){const w=stage.clientWidth,hh=stage.clientHeight;renderer.setSize(w,hh,false);camera.aspect=w/hh;camera.updateProjectionMatrix();}
new ResizeObserver(resize).observe(stage);resize();

const clock=new THREE.Clock();const tmp=new THREE.Vector3();const lavaCool=new THREE.Color(0x4a4442),lavaHot=new THREE.Color(0xffffff);
let heat=0;
function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(clock.getDelta(),0.05),T=clock.elapsedTime;
  if(tween){tween.t=Math.min(1,tween.t+dt/1.1);const e=1-Math.pow(1-tween.t,3);
    camera.position.lerpVectors(tween.p0,tween.p1,e);controls.target.lerpVectors(tween.t0,tween.t1,e);if(tween.t>=1)tween=null;}
  controls.update();
  heat+=((state.erupt?1:0)-heat)*Math.min(1,dt*2);
  lMat.color.copy(lavaCool).lerp(lavaHot,heat);ltex.offset.y-=dt*0.35*heat;
  glowLight.intensity=heat*(2.2+0.6*Math.sin(T*13)*Math.sin(T*7));
  glowM.opacity=0.25+heat*(0.45+0.2*Math.sin(T*4));
  if(state.erupt){
    for(let i=0;i<AN;i++){al[i]+=dt;if(al[i]>4.5){spawnAsh(i);al[i]=0;}
      av[i*3+1]*=0.995;ap[i*3]+=(av[i*3]-0.35)*dt;ap[i*3+1]+=av[i*3+1]*dt;ap[i*3+2]+=(av[i*3+2]-0.2)*dt;}
    ag.attributes.position.needsUpdate=true;
    for(let i=0;i<BN;i++){bv[i*3+1]-=9.8*dt*0.6;bp[i*3]+=bv[i*3]*dt;bp[i*3+1]+=bv[i*3+1]*dt;bp[i*3+2]+=bv[i*3+2]*dt;
      if(bp[i*3+1]<h(bp[i*3],bp[i*3+2]))spawnB(i);}
    bg.attributes.position.needsUpdate=true;
  }
  renderer.render(scene,camera);
  const w=stage.clientWidth,hh=stage.clientHeight;
  for(const s of SPOTS){tmp.copy(s.v).project(camera);
    const hide=tmp.z>1||Math.abs(tmp.x)>1.05||Math.abs(tmp.y)>1.05;s.el.hidden=hide;
    if(!hide){s.el.style.left=((tmp.x*.5+.5)*w)+'px';s.el.style.top=((-tmp.y*.5+.5)*hh)+'px';}
    s.el.classList.toggle('inside',!!s.cut&&!state.cut);}
}
camera.position.sub(controls.target).multiplyScalar(fitK()).add(controls.target);
loop();
})();
</script>
